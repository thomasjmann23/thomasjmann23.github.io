<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d"><title id="t">Racial gaps in simulated LLM mortgage underwriting, with and without a debiasing prompt</title><desc id="d">Two bar charts from Bowen, Price, Stein and Yang 2024 using GPT-4 Turbo. Approval gap for Black versus white applicants: 8.5 percentage points at baseline, about zero with a 'use no bias' instruction. Interest rate gap: 35 basis points at baseline, 14 basis points with the instruction.</desc><style>
.bg{fill:#f1f1ed}.ink{fill:#16181c}.mut{fill:#50555d}.acc{fill:#2346d8}.acc2{fill:#8fa0ea}.watch{fill:#7d5300}.high{fill:#a8321f}
.rule{stroke:rgba(22,24,28,.16);stroke-width:1}.rule2{stroke:#16181c;stroke-width:1}.accs{stroke:#2346d8}.watchs{stroke:#7d5300}.inks{stroke:#16181c}.muts{stroke:#50555d}.highs{stroke:#a8321f}
.box{fill:#e7e7e2;stroke:rgba(22,24,28,.3)}.boxa{fill:rgba(35,70,216,.08);stroke:#2346d8}.boxw{fill:rgba(125,83,0,.08);stroke:#7d5300}
text{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}.mono{font-family:"IBM Plex Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){.bg{fill:#1b1c20}.ink{fill:#e6e5e0}.mut{fill:#a2a5ab}.acc{fill:#93a6ff}.acc2{fill:#c9d2ff}.watch{fill:#f0c46a}.high{fill:#ff9a85}
.rule{stroke:rgba(230,229,224,.14)}.rule2,.inks{stroke:#e6e5e0}.accs{stroke:#93a6ff}.watchs{stroke:#f0c46a}.muts{stroke:#a2a5ab}.highs{stroke:#ff9a85}
.box{fill:#18191c;stroke:rgba(230,229,224,.28)}.boxa{fill:rgba(147,166,255,.1);stroke:#93a6ff}.boxw{fill:rgba(240,196,106,.1);stroke:#f0c46a}}
</style><rect class="bg" width="760" height="300" rx="6"/><text x="24.0" y="34.0" class="ink" font-size="18" font-weight="700" text-anchor="start" font-stretch="110%">Racial gaps in simulated LLM underwriting, and one prompt fix</text><text x="24.0" y="56.0" class="mut mono" font-size="11" font-weight="400" text-anchor="start">GPT-4 Turbo on 2022 HMDA mortgage files, race varied (Bowen, Price, Stein, Yang 2024)</text><text x="30.0" y="92.0" class="ink" font-size="12" font-weight="700" text-anchor="start">Approval gap, Black vs white (pp)</text><text x="30.0" y="127.0" class="ink" font-size="12" font-weight="500" text-anchor="start">Baseline prompt</text><rect class="high" x="170" y="112" width="132.6" height="22" rx="3"/><text x="308.6" y="127.5" class="ink mono" font-size="10.5" font-weight="600" text-anchor="start">8.5 pp</text><text x="30.0" y="167.0" class="ink" font-size="12" font-weight="500" text-anchor="start">'Use no bias' added</text><rect class="acc" x="170" y="152" width="1.2" height="22" rx="3"/><text x="177.2" y="167.5" class="ink mono" font-size="10.5" font-weight="600" text-anchor="start">~0</text><text x="400.0" y="92.0" class="ink" font-size="12" font-weight="700" text-anchor="start">Interest rate gap, Black vs white (bp)</text><text x="400.0" y="127.0" class="ink" font-size="12" font-weight="500" text-anchor="start">Baseline prompt</text><rect class="high" x="540" y="112" width="136.5" height="22" rx="3"/><text x="682.5" y="127.5" class="ink mono" font-size="10.5" font-weight="600" text-anchor="start">35 bp</text><text x="400.0" y="167.0" class="ink" font-size="12" font-weight="500" text-anchor="start">'Use no bias' added</text><rect class="acc" x="540" y="152" width="54.6" height="22" rx="3"/><text x="600.6" y="167.5" class="ink mono" font-size="10.5" font-weight="600" text-anchor="start">14 bp</text><line class="rule" x1="30" y1="210" x2="730" y2="210"/><text x="30.0" y="234.0" class="mut mono" font-size="10.5" font-weight="400" text-anchor="start">At baseline, Black applicants needed about 120 more credit-score points for the same approval rate,</text><text x="30.0" y="252.0" class="mut mono" font-size="10.5" font-weight="400" text-anchor="start">and about 30 more for the same rate. The study tests underwriting, not borrower-facing chatbots;</text><text x="30.0" y="270.0" class="mut mono" font-size="10.5" font-weight="400" text-anchor="start">it shows models can carry bias into credit outputs, and that the fix was cheap but partial.</text></svg>