<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="t d"><title id="t">Information channels for small-business loan shoppers</title><desc id="d">Matrix of five channels: general chatbot or AI search, marketplace or broker, accounting-platform AI, lender's own assistant, and SBA Lender Match. For each, who controls the answer, whether it shows pricing, and the main rule that reaches it. General chatbots are the least regulated; a lender's own assistant is the most.</desc><style>
.bg{fill:#f1f1ed}.ink{fill:#16181c}.mut{fill:#50555d}.acc{fill:#2346d8}.acc2{fill:#8fa0ea}.watch{fill:#7d5300}.high{fill:#a8321f}
.rule{stroke:rgba(22,24,28,.16);stroke-width:1}.rule2{stroke:#16181c;stroke-width:1}.accs{stroke:#2346d8}.watchs{stroke:#7d5300}.inks{stroke:#16181c}.muts{stroke:#50555d}.highs{stroke:#a8321f}
.box{fill:#e7e7e2;stroke:rgba(22,24,28,.3)}.boxa{fill:rgba(35,70,216,.08);stroke:#2346d8}.boxw{fill:rgba(125,83,0,.08);stroke:#7d5300}
text{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}.mono{font-family:"IBM Plex Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){.bg{fill:#1b1c20}.ink{fill:#e6e5e0}.mut{fill:#a2a5ab}.acc{fill:#93a6ff}.acc2{fill:#c9d2ff}.watch{fill:#f0c46a}.high{fill:#ff9a85}
.rule{stroke:rgba(230,229,224,.14)}.rule2,.inks{stroke:#e6e5e0}.accs{stroke:#93a6ff}.watchs{stroke:#f0c46a}.muts{stroke:#a2a5ab}.highs{stroke:#ff9a85}
.box{fill:#18191c;stroke:rgba(230,229,224,.28)}.boxa{fill:rgba(147,166,255,.1);stroke:#93a6ff}.boxw{fill:rgba(240,196,106,.1);stroke:#f0c46a}}
</style><rect class="bg" width="760" height="520" rx="6"/><text x="24.0" y="34.0" class="ink" font-size="18" font-weight="700" text-anchor="start" font-stretch="110%">Where a small-business owner now gets loan information</text><text x="24.0" y="56.0" class="mut mono" font-size="11" font-weight="400" text-anchor="start">Who writes the answer, and which rule reaches it</text><text x="30.0" y="88.0" class="mut mono" font-size="10" font-weight="500" text-anchor="start">CHANNEL</text><text x="200.0" y="88.0" class="mut mono" font-size="10" font-weight="500" text-anchor="start">WHO CONTROLS THE ANSWER</text><text x="400.0" y="88.0" class="mut mono" font-size="10" font-weight="500" text-anchor="start">SHOWS PRICING?</text><text x="560.0" y="88.0" class="mut mono" font-size="10" font-weight="500" text-anchor="start">MAIN RULE THAT REACHES IT</text><line class="rule2" x1="30" y1="96" x2="730" y2="96"/><rect class="boxw" x="30" y="108" width="158" height="58" rx="4"/><text x="40.0" y="133.0" class="ink" font-size="12" font-weight="700" text-anchor="start">General chatbot /</text><text x="40.0" y="149.0" class="ink" font-size="12" font-weight="700" text-anchor="start">AI search</text><text x="200.0" y="133.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Model provider; ads</text><text x="200.0" y="149.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">possible in some uses</text><text x="400.0" y="133.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Only what it has</text><text x="400.0" y="149.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">read or guessed</text><text x="560.0" y="133.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">None specific to lending;</text><text x="560.0" y="149.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">ad policy, FTC Act</text><line class="rule" x1="30" y1="174" x2="730" y2="174"/><rect class="box" x="30" y="182" width="158" height="58" rx="4"/><text x="40.0" y="215.0" class="ink" font-size="12" font-weight="700" text-anchor="start">Marketplace or broker</text><text x="200.0" y="207.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Paid by lenders</text><text x="200.0" y="223.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">(lead generation)</text><text x="400.0" y="207.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Ranges; offers after</text><text x="400.0" y="223.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">data is collected</text><text x="560.0" y="207.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">State disclosure laws</text><text x="560.0" y="223.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">(some), FTC Act</text><line class="rule" x1="30" y1="248" x2="730" y2="248"/><rect class="box" x="30" y="256" width="158" height="58" rx="4"/><text x="40.0" y="289.0" class="ink" font-size="12" font-weight="700" text-anchor="start">Accounting-platform AI</text><text x="200.0" y="281.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Platform that is</text><text x="200.0" y="297.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">also a lender</text><text x="400.0" y="281.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Peer benchmarks of</text><text x="400.0" y="297.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">its own loans</text><text x="560.0" y="281.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Reg B for its lending;</text><text x="560.0" y="297.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">state law</text><line class="rule" x1="30" y1="322" x2="730" y2="322"/><rect class="boxa" x="30" y="330" width="158" height="58" rx="4"/><text x="40.0" y="363.0" class="ink" font-size="12" font-weight="700" text-anchor="start">Lender's own assistant</text><text x="200.0" y="363.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">The creditor</text><text x="400.0" y="363.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Its own products</text><text x="560.0" y="355.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Reg B (incl. discouragement),</text><text x="560.0" y="371.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">state law, SR 26-2 scope gap</text><line class="rule" x1="30" y1="396" x2="730" y2="396"/><rect class="box" x="30" y="404" width="158" height="58" rx="4"/><text x="40.0" y="437.0" class="ink" font-size="12" font-weight="700" text-anchor="start">SBA Lender Match</text><text x="200.0" y="429.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">SBA; lenders</text><text x="200.0" y="445.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">respond</text><text x="400.0" y="429.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">No; lenders quote</text><text x="400.0" y="445.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">after matching</text><text x="560.0" y="429.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">SBA program rules;</text><text x="560.0" y="445.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Reg B for lenders</text><line class="rule" x1="30" y1="470" x2="730" y2="470"/><text x="30.0" y="486.0" class="mut mono" font-size="10.5" font-weight="400" text-anchor="start">Amber: least regulated. Cobalt: most regulated. A creditor's own chatbot output is a written statement</text><text x="30.0" y="504.0" class="mut mono" font-size="10.5" font-weight="400" text-anchor="start">under Regulation B; a third-party chatbot that is not a creditor is outside ECOA's direct reach.</text></svg>