.box{fill:#e7e7e2;stroke:rgba(22,24,28,.3)}.boxa{fill:rgba(35,70,216,.08);stroke:#2346d8}.boxw{fill:rgba(125,83,0,.08);stroke:#7d5300}
text{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}.mono{font-family:"IBM Plex Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){.bg{fill:#1b1c20}.ink{fill:#e6e5e0}.mut{fill:#a2a5ab}.acc{fill:#93a6ff}.acc2{fill:#c9d2ff}.watch{fill:#f0c46a}.high{fill:#ff9a85}
.rule{stroke:rgba(230,229,224,.14)}.rule2,.inks{stroke:#e6e5e0}.accs{stroke:#93a6ff}.watchs{stroke:#f0c46a}.muts{stroke:#a2a5ab}.highs{stroke:#ff9a85}
.box{fill:#18191c;stroke:rgba(230,229,224,.28)}.boxa{fill:rgba(147,166,255,.1);stroke:#93a6ff}.boxw{fill:rgba(240,196,106,.1);stroke:#f0c46a}}
</style><rect class="bg" width="760" height="380" rx="6"/><text x="24.0" y="34.0" class="ink" font-size="18" font-weight="700" text-anchor="start" font-stretch="110%">Borrower experience by lender type, 2025 survey</text><text x="24.0" y="56.0" class="mut mono" font-size="11" font-weight="400" text-anchor="start">Fed Small Business Credit Survey, employer firms, fielded Sep–Nov 2025</text><text x="30.0" y="92.0" class="ink" font-size="12" font-weight="700" text-anchor="start">Satisfied with lender (% of approved applicants)</text><text x="30.0" y="122.0" class="ink" font-size="12" font-weight="500" text-anchor="start">Credit union</text><rect class="acc" x="150" y="108" width="144.4" height="18" rx="3"/><text x="300.4" y="121.5" class="ink mono" font-size="10.5" font-weight="600" text-anchor="start">76%</text><text x="30.0" y="152.0" class="ink" font-size="12" font-weight="500" text-anchor="start">Small bank</text><rect class="acc" x="150" y="138" width="123.5" height="18" rx="3"/><text x="279.5" y="151.5" class="ink mono" font-size="10.5" font-weight="600" text-anchor="start">65%</text><text x="30.0" y="182.0" class="ink" font-size="12" font-weight="500" text-anchor="start">Large bank</text><rect class="acc" x="150" y="168" width="121.6" height="18" rx="3"/><text x="277.6" y="181.5" class="ink mono" font-size="10.5" font-weight="600" text-anchor="start">64%</text><text x="30.0" y="212.0" class="ink" font-size="12" font-weight="500" text-anchor="start">Finance company</text><rect class="acc" x="150" y="198" width="108.3" height="18" rx="3"/><text x="264.3" y="211.5" class="ink mono" font-size="10.5" font-weight="600" text-anchor="start">57%</text><text x="30.0" y="242.0" class="ink" font-size="12" font-weight="500" text-anchor="start">Online lender</text><rect class="high" x="150" y="228" width="66.5" height="18" rx="3"/><text x="222.5" y="241.5" class="ink mono" font-size="10.5" font-weight="600" text-anchor="start">35%</text><text x="420.0" y="92.0" class="ink" font-size="12" font-weight="700" text-anchor="start">Actual cost higher than expected (% of borrowers)</text><text x="420.0" y="122.0" class="ink" font-size="12" font-weight="500" text-anchor="start">Online lender</text><rect class="high" x="530" y="108" width="114.0" height="18" rx="3"/><text x="650.0" y="121.5" class="ink mono" font-size="10.5" font-weight="600" text-anchor="start">60%</text><text x="420.0" y="152.0" class="ink" font-size="12" font-weight="500" text-anchor="start">Small bank</text><rect class="acc" x="530" y="138" width="70.3" height="18" rx="3"/><text x="606.3" y="151.5" class="ink mono" font-size="10.5" font-weight="600" text-anchor="start">37%</text><text x="420.0" y="182.0" class="ink" font-size="12" font-weight="500" text-anchor="start">Large bank</text><rect class="acc" x="530" y="168" width="60.8" height="18" rx="3"/><text x="596.8" y="181.5" class="ink mono" font-size="10.5" font-weight="600" text-anchor="start">32%</text><line class="rule" x1="30" y1="282" x2="730" y2="282"/><text x="30.0" y="304.0" class="mut mono" font-size="10.5" font-weight="400" text-anchor="start">Online lenders' share of loan, line and cash-advance applicants rose from 17% (2020) to 29% (2025).</text><text x="30.0" y="322.0" class="mut mono" font-size="10.5" font-weight="400" text-anchor="start">Bases: satisfaction n = 107 to 634 per lender type; cost n = 408 to 553.</text><text x="30.0" y="340.0" class="mut mono" font-size="10.5" font-weight="400" text-anchor="start">Convenience sample weighted to the small-firm population; differences are indicative.</text></svg>