<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d"><title id="t">Borrower experience by lender type, 2025 Small Business Credit Survey</title><desc id="d">Two bar charts. Share of approved applicants satisfied with their lender: credit union 76%, small bank 65%, large bank 64%, finance company 57%, online lender 35%. Share of borrowers whose actual cost was higher than expected: online lender 60%, small bank 37%, large bank 32%.</desc><style>
.bg{fill:#f1f1ed}.ink{fill:#16181c}.mut{fill:#50555d}.acc{fill:#2346d8}.acc2{fill:#8fa0ea}.watch{fill:#7d5300}.high{fill:#a8321f}
