<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" role="img" aria-labelledby="t d"><title id="t">Timeline of disclosure rules, data rules and borrower-facing AI tools, 2018 to 2028</title><desc id="d">Vertical timeline. Rules and research on the left: California law 2018, Fed Uncertain Terms 2019, CFPB chatbot spotlight 2023, Georgia law 2024, Lehigh LLM bias study 2024, Texas HB 700 2025, California SB 362 2026, Regulation B changes July 2026, UGA chatbot study July 2026, Section 1071 compliance 2028. Tools on the right: Nav next best option 2024, Lendio and BOND.AI 2026, QuickBooks Capital benchmarks in ChatGPT and Claude 2026, SBA iCAP November 2026.</desc><style>
.bg{fill:#f1f1ed}.ink{fill:#16181c}.mut{fill:#50555d}.acc{fill:#2346d8}.acc2{fill:#8fa0ea}.watch{fill:#7d5300}.high{fill:#a8321f}
.rule{stroke:rgba(22,24,28,.16);stroke-width:1}.rule2{stroke:#16181c;stroke-width:1}.accs{stroke:#2346d8}.watchs{stroke:#7d5300}.inks{stroke:#16181c}.muts{stroke:#50555d}.highs{stroke:#a8321f}
.box{fill:#e7e7e2;stroke:rgba(22,24,28,.3)}.boxa{fill:rgba(35,70,216,.08);stroke:#2346d8}.boxw{fill:rgba(125,83,0,.08);stroke:#7d5300}
text{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}.mono{font-family:"IBM Plex Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){.bg{fill:#1b1c20}.ink{fill:#e6e5e0}.mut{fill:#a2a5ab}.acc{fill:#93a6ff}.acc2{fill:#c9d2ff}.watch{fill:#f0c46a}.high{fill:#ff9a85}
.rule{stroke:rgba(230,229,224,.14)}.rule2,.inks{stroke:#e6e5e0}.accs{stroke:#93a6ff}.watchs{stroke:#f0c46a}.muts{stroke:#a2a5ab}.highs{stroke:#ff9a85}
.box{fill:#18191c;stroke:rgba(230,229,224,.28)}.boxa{fill:rgba(147,166,255,.1);stroke:#93a6ff}.boxw{fill:rgba(240,196,106,.1);stroke:#f0c46a}}
</style><rect class="bg" width="760" height="590" rx="6"/><text x="24.0" y="34.0" class="ink" font-size="18" font-weight="700" text-anchor="start" font-stretch="110%">Disclosure rules, data rules and AI tools, 2018 to 2028</text><text x="24.0" y="56.0" class="mut mono" font-size="11" font-weight="400" text-anchor="start">Left: rules and research. Right: borrower-facing AI and tools.</text><line class="rule2" x1="380" y1="78" x2="380" y2="540"/><circle class="ink" cx="380" cy="88" r="4"/><text x="366.0" y="85.0" class="mut mono" font-size="10" font-weight="500" text-anchor="end">2018</text><text x="366.0" y="100.0" class="ink" font-size="11.5" font-weight="500" text-anchor="end">California enacts commercial financing disclosure law</text><circle class="ink" cx="380" cy="121" r="4"/><text x="366.0" y="118.0" class="mut mono" font-size="10" font-weight="500" text-anchor="end">Dec 2019</text><text x="366.0" y="133.0" class="ink" font-size="11.5" font-weight="500" text-anchor="end">Fed: online lender sites vary widely on cost information</text><circle class="ink" cx="380" cy="154" r="4"/><text x="366.0" y="151.0" class="mut mono" font-size="10" font-weight="500" text-anchor="end">Jun 2023</text><text x="366.0" y="166.0" class="ink" font-size="11.5" font-weight="500" text-anchor="end">CFPB issue spotlight on bank chatbots</text><circle class="ink" cx="380" cy="187" r="4"/><text x="366.0" y="184.0" class="mut mono" font-size="10" font-weight="500" text-anchor="end">Jan 2024</text><text x="366.0" y="199.0" class="ink" font-size="11.5" font-weight="500" text-anchor="end">Georgia disclosure law (no APR) takes effect</text><circle class="acc" cx="380" cy="220" r="4"/><text x="394.0" y="217.0" class="acc mono" font-size="10" font-weight="600" text-anchor="start">Jan 2024</text><text x="394.0" y="232.0" class="ink" font-size="11.5" font-weight="500" text-anchor="start">Nav launches 'next best option' after declines</text><circle class="ink" cx="380" cy="253" r="4"/><text x="366.0" y="250.0" class="mut mono" font-size="10" font-weight="500" text-anchor="end">May 2024</text><text x="366.0" y="265.0" class="ink" font-size="11.5" font-weight="500" text-anchor="end">Lehigh study: LLM underwriting shows racial gaps</text><circle class="ink" cx="380" cy="286" r="4"/><text x="366.0" y="283.0" class="mut mono" font-size="10" font-weight="500" text-anchor="end">Sep 2025</text><text x="366.0" y="298.0" class="ink" font-size="11.5" font-weight="500" text-anchor="end">Texas HB 700 disclosures for sales-based financing</text><circle class="ink" cx="380" cy="319" r="4"/><text x="366.0" y="316.0" class="mut mono" font-size="10" font-weight="500" text-anchor="end">Jan 2026</text><text x="366.0" y="331.0" class="ink" font-size="11.5" font-weight="500" text-anchor="end">California SB 362: APR whenever a price is quoted</text><circle class="acc" cx="380" cy="352" r="4"/><text x="394.0" y="349.0" class="acc mono" font-size="10" font-weight="600" text-anchor="start">Feb 2026</text><text x="394.0" y="364.0" class="ink" font-size="11.5" font-weight="500" text-anchor="start">Lendio and BOND.AI: bank-side offer targeting</text><circle class="ink" cx="380" cy="385" r="4"/><text x="366.0" y="382.0" class="mut mono" font-size="10" font-weight="500" text-anchor="end">Jul 8, 2026</text><text x="366.0" y="397.0" class="ink" font-size="11.5" font-weight="500" text-anchor="end">UGA study: chatbot advice varies by race, gender</text><circle class="ink" cx="380" cy="418" r="4"/><text x="366.0" y="415.0" class="mut mono" font-size="10" font-weight="500" text-anchor="end">Jul 21, 2026</text><text x="366.0" y="430.0" class="ink" font-size="11.5" font-weight="500" text-anchor="end">Reg B: effects test removed; discouragement narrowed</text><circle class="acc" cx="380" cy="451" r="4"/><text x="394.0" y="448.0" class="acc mono" font-size="10" font-weight="600" text-anchor="start">Jul 28, 2026</text><text x="394.0" y="463.0" class="ink" font-size="11.5" font-weight="500" text-anchor="start">QuickBooks Capital loan benchmarks in ChatGPT, Claude</text><circle class="acc" cx="380" cy="484" r="4"/><text x="394.0" y="481.0" class="acc mono" font-size="10" font-weight="600" text-anchor="start">Nov 2026</text><text x="394.0" y="496.0" class="ink" font-size="11.5" font-weight="500" text-anchor="start">SBA launches iCAP lender platform</text><circle class="ink" cx="380" cy="517" r="4"/><text x="366.0" y="514.0" class="mut mono" font-size="10" font-weight="500" text-anchor="end">Jan 2028</text><text x="366.0" y="529.0" class="ink" font-size="11.5" font-weight="500" text-anchor="end">Section 1071 data collection begins (no pricing)</text><text x="30.0" y="568.0" class="mut mono" font-size="10.5" font-weight="400" text-anchor="start">Sources: see the caption. Dates are announcement or effective dates as stated by each source.</text></svg>