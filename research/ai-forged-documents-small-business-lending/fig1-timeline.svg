</style><rect class="bg" width="760" height="520" rx="6"/><text x="24" y="34" class="ink" font-size="18" font-weight="700" text-anchor="start" font-stretch="110%">Warnings, tools and incidents, 2023 to 2026</text><text x="24" y="56" class="mut mono" font-size="11" font-weight="400" text-anchor="start">Regulators and auditors (left)  ·  vendors, press and incidents (right)</text><line class="rule2" x1="380" y1="78" x2="380" y2="458"/><circle class="acc" cx="380" cy="88" r="5"/><text x="366" y="85" class="mut mono" font-size="10" font-weight="500" text-anchor="end">2023</text><text x="366" y="99" class="ink" font-size="11.5" font-weight="400" text-anchor="end">Rise in deepfake-related SARs begins (per FinCEN)</text><circle class="acc" cx="380" cy="128" r="5"/><text x="366" y="125" class="mut mono" font-size="10" font-weight="500" text-anchor="end">Nov 2024</text><text x="366" y="139" class="ink" font-size="11.5" font-weight="400" text-anchor="end">FinCEN alert FIN-2024-Alert004</text><circle class="acc" cx="380" cy="168" r="5"/><text x="366" y="165" class="mut mono" font-size="10" font-weight="500" text-anchor="end">Dec 2024</text><text x="366" y="179" class="ink" font-size="11.5" font-weight="400" text-anchor="end">FBI warns of AI-made fake IDs</text><circle class="watch" cx="380" cy="208" r="5"/><text x="394" y="205" class="mut mono" font-size="10" font-weight="500" text-anchor="start">Mar 2025</text><text x="394" y="219" class="ink" font-size="11.5" font-weight="400" text-anchor="start">ChatGPT image tool used to fake receipts</text><circle class="watch" cx="380" cy="248" r="5"/><text x="394" y="245" class="mut mono" font-size="10" font-weight="500" text-anchor="start">Apr 2025</text><text x="394" y="259" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Inscribe launches AI-document detector</text><circle class="watch" cx="380" cy="288" r="5"/><text x="394" y="285" class="mut mono" font-size="10" font-weight="500" text-anchor="start">Feb 2026</text><text x="394" y="299" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Resistant AI: 160+ template sites tracked</text><circle class="watch" cx="380" cy="328" r="5"/><text x="394" y="325" class="mut mono" font-size="10" font-weight="500" text-anchor="start">Feb 2026</text><text x="394" y="339" class="ink" font-size="11.5" font-weight="400" text-anchor="start">CBA reportedly refers up to A$1bn of loans to police</text><circle class="acc" cx="380" cy="368" r="5"/><text x="366" y="365" class="mut mono" font-size="10" font-weight="500" text-anchor="end">May 2026</text><text x="366" y="379" class="ink" font-size="11.5" font-weight="400" text-anchor="end">SBA OIG semiannual report: fake statements in 7(a)/PPP scheme</text><circle class="acc" cx="380" cy="408" r="5"/><text x="366" y="405" class="mut mono" font-size="10" font-weight="500" text-anchor="end">Aug 2026</text><text x="366" y="419" class="ink" font-size="11.5" font-weight="400" text-anchor="end">SBA OIG 26-12: guaranty reversals unsupported</text><circle class="watch" cx="380" cy="448" r="5"/><text x="394" y="445" class="mut mono" font-size="10" font-weight="500" text-anchor="start">Oct 2026</text><text x="394" y="459" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Ocrolus: 1 in 8 SMB applications suspicious</text><text x="24" y="500" class="mut mono" font-size="10.5" font-weight="400" text-anchor="start">Vendor and press items are announcements or reports, not independently confirmed events.</text></svg>