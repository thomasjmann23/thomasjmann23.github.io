<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="t d"><title id="t">Warnings, tools and incidents, 2023 to 2026</title><desc id="d">Timeline. Regulators: 2023 rise in deepfake-related suspicious activity reports; November 2024 FinCEN alert; December 2024 FBI warning on AI-made fake IDs; May 2026 SBA OIG semiannual report describing fake bank statements in a 7(a), EIDL and PPP scheme; August 2026 SBA OIG report 26-12 on unsupported guaranty reversals. Vendors and press: March 2025 ChatGPT image tool used to fake receipts; April 2025 Inscribe AI-document detector; February 2026 Resistant AI tracks 160-plus template sites; February 2026 Commonwealth Bank reportedly refers up to A$1 billion of loans to police; October 2026 Ocrolus says 1 in 8 small-business applications contained suspicious documents.</desc><style>
