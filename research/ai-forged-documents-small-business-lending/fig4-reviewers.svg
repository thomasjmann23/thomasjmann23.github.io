<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d"><title id="t">What experienced reviewers caught</title><desc id="d">Bar chart from Ren et al. 2026. Where the forged file had an internal inconsistency, reviewers raised an edit-supported concern in 9 of 23 judgements, 39.1 percent. Where the only inconsistency was across files, 5 of 78, 6.4 percent. Where there was no inconsistency, 0 of 31. Overall 14 of 132 judgements, 10.6 percent.</desc><style>
