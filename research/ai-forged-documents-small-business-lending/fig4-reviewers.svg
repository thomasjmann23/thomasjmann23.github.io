</style><rect class="bg" width="760" height="330" rx="6"/><text x="24" y="34" class="ink" font-size="18" font-weight="700" text-anchor="start" font-stretch="110%">What experienced reviewers caught</text><text x="24" y="56" class="mut mono" font-size="11" font-weight="400" text-anchor="start">Edit-supported concerns raised / judgements, by type of inconsistency</text><line class="rule" x1="280" y1="76" x2="280" y2="262"/><text x="280" y="278" class="mut mono" font-size="10.5" font-weight="400" text-anchor="middle">0%</text><line class="rule" x1="370" y1="76" x2="370" y2="262"/><text x="370" y="278" class="mut mono" font-size="10.5" font-weight="400" text-anchor="middle">10%</text><line class="rule" x1="460" y1="76" x2="460" y2="262"/><text x="460" y="278" class="mut mono" font-size="10.5" font-weight="400" text-anchor="middle">20%</text><line class="rule" x1="550" y1="76" x2="550" y2="262"/><text x="550" y="278" class="mut mono" font-size="10.5" font-weight="400" text-anchor="middle">30%</text><line class="rule" x1="640" y1="76" x2="640" y2="262"/><text x="640" y="278" class="mut mono" font-size="10.5" font-weight="400" text-anchor="middle">40%</text><line class="rule" x1="730" y1="76" x2="730" y2="262"/><text x="730" y="278" class="mut mono" font-size="10.5" font-weight="400" text-anchor="middle">50%</text><text x="24" y="107" class="ink" font-size="12" font-weight="700" text-anchor="start">Inconsistency within the file</text><text x="24" y="125" class="mut mono" font-size="10.5" font-weight="400" text-anchor="start">9 of 23 judgements</text><rect class="acc" x="280" y="92" width="352.2" height="22" rx="3"/><text x="640.1739130434783" y="107" class="ink mono" font-size="11" font-weight="600" text-anchor="start">39.1%</text><text x="24" y="165" class="ink" font-size="12" font-weight="700" text-anchor="start">Inconsistency only across files</text><text x="24" y="183" class="mut mono" font-size="10.5" font-weight="400" text-anchor="start">5 of 78 judgements</text><rect class="acc" x="280" y="150" width="57.7" height="22" rx="3"/><text x="345.6923076923077" y="165" class="ink mono" font-size="11" font-weight="600" text-anchor="start">6.4%</text><text x="24" y="223" class="ink" font-size="12" font-weight="700" text-anchor="start">No inconsistency</text><text x="24" y="241" class="mut mono" font-size="10.5" font-weight="400" text-anchor="start">0 of 31 judgements</text><text x="288.0" y="223" class="ink mono" font-size="11" font-weight="600" text-anchor="start">0.0%</text><text x="24" y="296" class="ink mono" font-size="10.5" font-weight="500" text-anchor="start">Overall: 14 of 132 judgements (10.6%). No visual cue exposed an edit.</text><text x="24" y="314" class="mut mono" font-size="10.5" font-weight="400" text-anchor="start">Three reviewers; 134 identity-swapped PDFs; no genuine control files. Authors work for a detection vendor.</text></svg>