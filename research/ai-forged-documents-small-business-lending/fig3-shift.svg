<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d"><title id="t">Forgeries are more organised and more complete</title><desc id="d">Paired bar chart from Inscribe network data. Template-based fraud rose from 1 in 14 flagged documents in 2024 to 1 in 5 in 2025. Altered documents with financial edits: 89.4 percent in 2024, 91.2 percent in 2025. Altered documents with both identity and financial edits: 40.2 percent in 2024, 59.8 percent in 2025.</desc><style>
