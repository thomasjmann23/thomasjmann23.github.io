class="ink" font-size="11.5" font-weight="700" text-anchor="start">Financial edits, share of</text><text x="24" y="194" class="ink" font-size="11.5" font-weight="700" text-anchor="start">altered documents</text><text x="322" y="178" class="mut mono" font-size="10" font-weight="400" text-anchor="end">2024</text><rect class="acc2" x="330" y="166" width="321.8" height="18" rx="3"/><text x="657.84" y="179" class="ink mono" font-size="11" font-weight="600" text-anchor="start">89.4%</text><text x="322" y="202" class="mut mono" font-size="10" font-weight="400" text-anchor="end">2025</text><rect class="acc" x="330" y="190" width="328.3" height="18" rx="3"/><text x="664.3199999999999" y="203" class="ink mono" font-size="11" font-weight="600" text-anchor="start">91.2%</text><text x="24" y="250" class="ink" font-size="11.5" font-weight="700" text-anchor="start">Identity and financial edits</text><text x="24" y="266" class="ink" font-size="11.5" font-weight="700" text-anchor="start">together</text><text x="322" y="250" class="mut mono" font-size="10" font-weight="400" text-anchor="end">2024</text><rect class="acc2" x="330" y="238" width="144.7" height="18" rx="3"/><text x="480.72" y="251" class="ink mono" font-size="11" font-weight="600" text-anchor="start">40.2%</text><text x="322" y="274" class="mut mono" font-size="10" font-weight="400" text-anchor="end">2025</text><rect class="acc" x="330" y="262" width="215.3" height="18" rx="3"/><text x="551.28" y="275" class="ink mono" font-size="11" font-weight="600" text-anchor="start">59.8%</text><text x="24" y="340" class="mut mono" font-size="10.5" font-weight="400" text-anchor="start">Template share shown as 1 in 14 (7.1%) and 1 in 5 (20%), as Inscribe reports it.</text></svg>