<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d"><title id="t">Three vendors, three fraud rates</title><desc id="d">Horizontal bar chart. Inscribe: 6 percent of documents flagged in 2025. Resistant AI: 9.08 percent of documents with high-risk markers in 2025. Ocrolus: 1 in 8, about 12.5 percent, of small-business loan applications contained a suspicious document over a 90-day period in 2026. Each figure uses a different denominator.</desc><style>
.bg{fill:#f1f1ed}.ink{fill:#16181c}.mut{fill:#50555d}.acc{fill:#2346d8}.acc2{fill:#8fa0ea}.watch{fill:#7d5300}.high{fill:#a8321f}
.rule{stroke:rgba(22,24,28,.16);stroke-width:1}.rule2{stroke:#16181c;stroke-width:1}.accs{stroke:#2346d8}.watchs{stroke:#7d5300}.inks{stroke:#16181c}.muts{stroke:#50555d}.highs{stroke:#a8321f}
.box{fill:#e7e7e2;stroke:rgba(22,24,28,.3)}.boxa{fill:rgba(35,70,216,.08);stroke:#2346d8}.boxw{fill:rgba(125,83,0,.08);stroke:#7d5300}.boxh{fill:rgba(168,50,31,.08);stroke:#a8321f}
text{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}.mono{font-family:"IBM Plex Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){.bg{fill:#1b1c20}.ink{fill:#e6e5e0}.mut{fill:#a2a5ab}.acc{fill:#93a6ff}.acc2{fill:#c9d2ff}.watch{fill:#f0c46a}.high{fill:#ff9a85}
.rule{stroke:rgba(230,229,224,.14)}.rule2,.inks{stroke:#e6e5e0}.accs{stroke:#93a6ff}.watchs{stroke:#f0c46a}.muts{stroke:#a2a5ab}.highs{stroke:#ff9a85}
.box{fill:#18191c;stroke:rgba(230,229,224,.28)}.boxa{fill:rgba(147,166,255,.1);stroke:#93a6ff}.boxw{fill:rgba(240,196,106,.1);stroke:#f0c46a}.boxh{fill:rgba(255,154,133,.1);stroke:#ff9a85}}
</style><rect class="bg" width="760" height="330" rx="6"/><text x="24" y="34" class="ink" font-size="18" font-weight="700" text-anchor="start" font-stretch="110%">Three vendors, three fraud rates</text><text x="24" y="56" class="mut mono" font-size="11" font-weight="400" text-anchor="start">Vendor-reported; each figure has a different denominator</text><line class="rule" x1="250" y1="76" x2="250" y2="268"/><text x="250" y="284" class="mut mono" font-size="10.5" font-weight="400" text-anchor="middle">0%</text><line class="rule" x1="400" y1="76" x2="400" y2="268"/><text x="400" y="284" class="mut mono" font-size="10.5" font-weight="400" text-anchor="middle">5%</text><line class="rule" x1="550" y1="76" x2="550" y2="268"/><text x="550" y="284" class="mut mono" font-size="10.5" font-weight="400" text-anchor="middle">10%</text><line class="rule" x1="700" y1="76" x2="700" y2="268"/><text x="700" y="284" class="mut mono" font-size="10.5" font-weight="400" text-anchor="middle">15%</text><text x="24" y="110" class="ink" font-size="13" font-weight="700" text-anchor="start">Inscribe</text><text x="24" y="128" class="mut" font-size="10.5" font-weight="400" text-anchor="start">Documents flagged, 2025</text><rect class="acc" x="250" y="96" width="180.0" height="22" rx="3"/><text x="438.0" y="111" class="ink mono" font-size="11" font-weight="600" text-anchor="start">6%</text><text x="24" y="172" class="ink" font-size="13" font-weight="700" text-anchor="start">Resistant AI</text><text x="24" y="190" class="mut" font-size="10.5" font-weight="400" text-anchor="start">Documents with high-risk markers, </text><text x="24" y="204" class="mut" font-size="10.5" font-weight="400" text-anchor="start">2025</text><rect class="acc" x="250" y="158" width="272.4" height="22" rx="3"/><text x="530.4" y="173" class="ink mono" font-size="11" font-weight="600" text-anchor="start">9.08%</text><text x="24" y="234" class="ink" font-size="13" font-weight="700" text-anchor="start">Ocrolus</text><text x="24" y="252" class="mut" font-size="10.5" font-weight="400" text-anchor="start">SMB applications with a suspicious</text><text x="24" y="266" class="mut" font-size="10.5" font-weight="400" text-anchor="start">document, 90 days, 2026</text><rect class="acc" x="250" y="220" width="375.0" height="22" rx="3"/><text x="633.0" y="235" class="ink mono" font-size="11" font-weight="600" text-anchor="start">1 in 8 (12.5%)</text><text x="24" y="310" class="mut mono" font-size="10.5" font-weight="400" text-anchor="start">Flags are model outputs, not confirmed fraud. No vendor publishes a false-positive rate.</text></svg>