<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500" role="img" aria-labelledby="t d"><title id="t">Two ways to build a spread</title><desc id="d">Diagram. Dedicated tool: text layer or OCR, then trained mapping from prior spreads, then an analyst review screen, then a source-linked spread in the loan origination system. LLM extraction: page image sent to a model, prompted JSON output, checks and review that must be built, then a spread with logged model version and prompt. Control points for both: arithmetic tie-outs, independent reconciliation to IRS transcripts, source linking, and ongoing monitoring.</desc><style>
.bg{fill:#f1f1ed}.ink{fill:#16181c}.mut{fill:#50555d}.acc{fill:#2346d8}.ocr{fill:#50555d}.ocr2{fill:#9a9ea5}.acc2{fill:#8fa0ea}.watch{fill:#7d5300}
.rule{stroke:rgba(22,24,28,.16);stroke-width:1}.rule2{stroke:#16181c;stroke-width:1}.accs{stroke:#2346d8}.watchs{stroke:#7d5300}.inks{stroke:#16181c}.muts{stroke:#50555d}
.box{fill:#e7e7e2;stroke:rgba(22,24,28,.3)}.boxa{fill:rgba(35,70,216,.08);stroke:#2346d8}
text{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}.mono{font-family:"IBM Plex Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){.bg{fill:#1b1c20}.ink{fill:#e6e5e0}.mut,.ocr{fill:#a2a5ab}.ocr2{fill:#d4d6da}.acc{fill:#93a6ff}.acc2{fill:#c9d2ff}.watch{fill:#f0c46a}
.rule{stroke:rgba(230,229,224,.14)}.rule2,.inks{stroke:#e6e5e0}.accs{stroke:#93a6ff}.watchs{stroke:#f0c46a}.muts{stroke:#a2a5ab}
.box{fill:#18191c;stroke:rgba(230,229,224,.28)}.boxa{fill:rgba(147,166,255,.1);stroke:#93a6ff}}
</style><rect class="bg" width="680" height="500" rx="6"/><text x="24" y="34" class="ink" font-size="19" font-weight="700" text-anchor="start" font-stretch="112%">Two ways to build a spread</text><text x="24" y="56" class="mut mono" font-size="12" font-weight="400" text-anchor="start" >Same inputs, same outputs, different engines. Controls apply to both.</text><text x="24" y="96" class="mut mono" font-size="11" font-weight="500" text-anchor="start" >DEDICATED SPREADING TOOL</text><text x="24" y="246" class="acc mono" font-size="11" font-weight="500" text-anchor="start" >GENERAL LLM EXTRACTION</text><rect class="box" x="24" y="106" width="146" height="84" rx="4"/><text x="34" y="128" class="ink" font-size="13" font-weight="600" text-anchor="start" >Text layer / OCR</text><text x="34" y="146" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >characters + boxes</text><text x="34" y="161" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >confidence per char</text><line class="muts" x1="170" y1="148" x2="184" y2="148" stroke-width="1.3"/><path class="muts" d="M183,144 L190,148 L183,152" fill="none" stroke-width="1.3"/><rect class="box" x="190" y="106" width="146" height="84" rx="4"/><text x="200" y="128" class="ink" font-size="13" font-weight="600" text-anchor="start" >Trained mapping</text><text x="200" y="146" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >learned from prior</text><text x="200" y="161" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >spreads + policy</text><line class="muts" x1="336" y1="148" x2="350" y2="148" stroke-width="1.3"/><path class="muts" d="M349,144 L356,148 L349,152" fill="none" stroke-width="1.3"/><rect class="box" x="356" y="106" width="146" height="84" rx="4"/><text x="366" y="128" class="ink" font-size="13" font-weight="600" text-anchor="start" >Review screen</text><text x="366" y="146" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >analyst confirms</text><text x="366" y="161" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >flagged fields</text><line class="muts" x1="502" y1="148" x2="516" y2="148" stroke-width="1.3"/><path class="muts" d="M515,144 L522,148 L515,152" fill="none" stroke-width="1.3"/><rect class="box" x="522" y="106" width="146" height="84" rx="4"/><text x="532" y="128" class="ink" font-size="13" font-weight="600" text-anchor="start" >Spread in LOS</text><text x="532" y="146" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >source-linked</text><text x="532" y="161" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >audit history</text><rect class="boxa" x="24" y="256" width="146" height="84" rx="4"/><text x="34" y="278" class="ink" font-size="13" font-weight="600" text-anchor="start" >Page image / PDF</text><text x="34" y="296" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >sent to model</text><text x="34" y="311" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >(optional OCR first)</text><line class="accs" x1="170" y1="298" x2="184" y2="298" stroke-width="1.3"/><path class="accs" d="M183,294 L190,298 L183,302" fill="none" stroke-width="1.3"/><rect class="boxa" x="190" y="256" width="146" height="84" rx="4"/><text x="200" y="278" class="ink" font-size="13" font-weight="600" text-anchor="start" >Prompted output</text><text x="200" y="296" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >JSON to template</text><text x="200" y="311" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >policy in prompt</text><line class="accs" x1="336" y1="298" x2="350" y2="298" stroke-width="1.3"/><path class="accs" d="M349,294 L356,298 L349,302" fill="none" stroke-width="1.3"/><rect class="boxa" x="356" y="256" width="146" height="84" rx="4"/><text x="366" y="278" class="ink" font-size="13" font-weight="600" text-anchor="start" >Checks + review</text><text x="366" y="296" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >must be built:</text><text x="366" y="311" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >tie-outs, quotes</text><line class="accs" x1="502" y1="298" x2="516" y2="298" stroke-width="1.3"/><path class="accs" d="M515,294 L522,298 L515,302" fill="none" stroke-width="1.3"/><rect class="boxa" x="522" y="256" width="146" height="84" rx="4"/><text x="532" y="278" class="ink" font-size="13" font-weight="600" text-anchor="start" >Spread</text><text x="532" y="296" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >log model version,</text><text x="532" y="311" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >prompt, reviewer</text><line class="rule2" x1="24" y1="374" x2="656" y2="374"/><text x="24" y="396" class="mut mono" font-size="11" font-weight="500" text-anchor="start" >CONTROL POINTS FOR BOTH</text><text x="24" y="420" class="ink" font-size="13" font-weight="600" text-anchor="start" >1  Arithmetic tie-outs</text><text x="46" y="436" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >balance, subtotals, net income</text><text x="354" y="420" class="ink" font-size="13" font-weight="600" text-anchor="start" >2  Independent reconciliation</text><text x="376" y="436" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >IRS transcripts, audited figures</text><text x="24" y="460" class="ink" font-size="13" font-weight="600" text-anchor="start" >3  Source linking</text><text x="46" y="476" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >every value points to its page</text><text x="354" y="460" class="ink" font-size="13" font-weight="600" text-anchor="start" >4  Monitoring</text><text x="376" y="476" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >override rates, re-test on updates</text></svg>