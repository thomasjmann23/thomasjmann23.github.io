<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 496" width="680" height="496" role="img" aria-labelledby="t d"><title id="t">Timeline of US guidance</title><desc id="d">Timeline: April 2011 SR 11-7; June 2023 interagency third-party guidance; July 2024 NIST AI 600-1; December 2024 Treasury AI report; October 2025 OCC 2025-26; April 2026 SR 26-2 replaces SR 11-7 with generative AI out of scope; September 2026 proposed third-party guidance; October 2026 SBA SOP 50 10 8.1; November 2026 OCC 2026-54 examiner framework.</desc><style>
