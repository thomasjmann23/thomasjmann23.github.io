<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="t d"><title id="t">Rules loosen while products launch</title><desc id="d">Timeline 2019 to 2026. Rules: December 2019 interagency statement on alternative data; October 2024 Section 1033 final rule; May 2025 CFPB guidance withdrawal including Circular 2022-03; August 2025 1033 reconsideration; October 2025 reported injunction; March 2026 SBA retires SBSS for 7(a) Small loans; April 2026 Regulation B final rule; May 2026 final Section 1071 rule; August 2026 new 1033 proposal at OIRA. Research: January 2025 NBER paper; June 2025 FinRegLab study. Products: September 2025 JPMorganChase and Nova Credit, JPMorgan and Plaid fee deal; October 2025 Plaid LendScore; November 2025 UltraFICO; September 2026 Experian commercial Cashflow Attributes; October 2026 Experian Cashflow Data Bureau and Plaid LendScore 2.</desc><style>
