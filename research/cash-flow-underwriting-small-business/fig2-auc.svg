<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d"><title id="t">Cash-flow data adds a little predictive power</title><desc id="d">Dot plot of ROC AUC. FinRegLab 2025: 0.652 without cash-flow data, 0.663 with. NBER working paper 33367 minimal specification: 0.617 FICO model, 0.634 cash-flow model. Preferred specification: 0.642 and 0.657. Gains of 0.011 to 0.017.</desc><style>
.bg{fill:#f1f1ed}.ink{fill:#16181c}.mut{fill:#50555d}.acc{fill:#2346d8}.acc2{fill:#8fa0ea}.watch{fill:#7d5300}.high{fill:#a8321f}
.rule{stroke:rgba(22,24,28,.16);stroke-width:1}.rule2{stroke:#16181c;stroke-width:1}.accs{stroke:#2346d8}.watchs{stroke:#7d5300}.inks{stroke:#16181c}.muts{stroke:#50555d}.highs{stroke:#a8321f}
.box{fill:#e7e7e2;stroke:rgba(22,24,28,.3)}.boxa{fill:rgba(35,70,216,.08);stroke:#2346d8}.boxw{fill:rgba(125,83,0,.08);stroke:#7d5300}.boxh{fill:rgba(168,50,31,.08);stroke:#a8321f}
text{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}.mono{font-family:"IBM Plex Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){.bg{fill:#1b1c20}.ink{fill:#e6e5e0}.mut{fill:#a2a5ab}.acc{fill:#93a6ff}.acc2{fill:#c9d2ff}.watch{fill:#f0c46a}.high{fill:#ff9a85}
.rule{stroke:rgba(230,229,224,.14)}.rule2,.inks{stroke:#e6e5e0}.accs{stroke:#93a6ff}.watchs{stroke:#f0c46a}.muts{stroke:#a2a5ab}.highs{stroke:#ff9a85}
.box{fill:#18191c;stroke:rgba(230,229,224,.28)}.boxa{fill:rgba(147,166,255,.1);stroke:#93a6ff}.boxw{fill:rgba(240,196,106,.1);stroke:#f0c46a}.boxh{fill:rgba(255,154,133,.1);stroke:#ff9a85}}
</style><rect class="bg" width="760" height="360" rx="6"/><text x="24" y="34" class="ink" font-size="18" font-weight="700" text-anchor="start" font-stretch="110%">Cash-flow data adds a little predictive power</text><text x="24" y="56" class="mut mono" font-size="11" font-weight="400" text-anchor="start">ROC AUC for default prediction, without and with cash-flow variables. Axis starts at 0.60.</text><line class="rule" x1="300.0" y1="80" x2="300.0" y2="282"/><text x="300.0" y="298" class="mut mono" font-size="10.5" font-weight="400" text-anchor="middle">0.60</text><line class="rule" x1="405.0" y1="80" x2="405.0" y2="282"/><text x="405.0" y="298" class="mut mono" font-size="10.5" font-weight="400" text-anchor="middle">0.62</text><line class="rule" x1="510.0" y1="80" x2="510.0" y2="282"/><text x="510.0" y="298" class="mut mono" font-size="10.5" font-weight="400" text-anchor="middle">0.64</text><line class="rule" x1="615.0" y1="80" x2="615.0" y2="282"/><text x="615.0" y="298" class="mut mono" font-size="10.5" font-weight="400" text-anchor="middle">0.66</text><line class="rule" x1="720.0" y1="80" x2="720.0" y2="282"/><text x="720.0" y="298" class="mut mono" font-size="10.5" font-weight="400" text-anchor="middle">0.68</text><text x="24" y="112" class="ink" font-size="13" font-weight="700" text-anchor="start">FinRegLab, 2025</text><text x="24" y="129" class="mut" font-size="10.5" font-weight="400" text-anchor="start">ML model, two fintech lenders, ~38,000 loans</text><line class="muts" x1="573.0" y1="108" x2="630.8" y2="108" stroke-width="2"/><circle class="mut" cx="573.0" cy="108" r="6"/><circle class="acc" cx="630.8" cy="108" r="6"/><text x="563.0" y="113" class="mut mono" font-size="10.5" font-weight="400" text-anchor="end">0.652</text><text x="640.8" y="113" class="ink mono" font-size="10.5" font-weight="600" text-anchor="start">0.663  (+0.011)</text><text x="24" y="176" class="ink" font-size="13" font-weight="700" text-anchor="start">NBER w33367, minimal spec</text><text x="24" y="193" class="mut" font-size="10.5" font-weight="400" text-anchor="start">Random forest, Lenders A and B, 38,021 loans</text><line class="muts" x1="389.2" y1="172" x2="478.5" y2="172" stroke-width="2"/><circle class="mut" cx="389.2" cy="172" r="6"/><circle class="acc" cx="478.5" cy="172" r="6"/><text x="379.2" y="177" class="mut mono" font-size="10.5" font-weight="400" text-anchor="end">0.617</text><text x="488.5" y="177" class="ink mono" font-size="10.5" font-weight="600" text-anchor="start">0.634  (+0.017)</text><text x="24" y="240" class="ink" font-size="13" font-weight="700" text-anchor="start">NBER w33367, preferred spec</text><text x="24" y="257" class="mut" font-size="10.5" font-weight="400" text-anchor="start">Random forest, Lenders A and B, 38,021 loans</text><line class="muts" x1="520.5" y1="236" x2="599.2" y2="236" stroke-width="2"/><circle class="mut" cx="520.5" cy="236" r="6"/><circle class="acc" cx="599.2" cy="236" r="6"/><text x="510.5" y="241" class="mut mono" font-size="10.5" font-weight="400" text-anchor="end">0.642</text><text x="609.2" y="241" class="ink mono" font-size="10.5" font-weight="600" text-anchor="start">0.657  (+0.015)</text><circle class="mut" cx="30" cy="322" r="5"/><text x="42" y="326" class="mut" font-size="11" font-weight="400" text-anchor="start">Credit score and basic firm data</text><circle class="acc" cx="250" cy="322" r="5"/><text x="262" y="326" class="mut" font-size="11" font-weight="400" text-anchor="start">Same model plus cash-flow variables</text><text x="24" y="346" class="mut mono" font-size="10" font-weight="400" text-anchor="start">The two studies share researchers and, it appears, much of the same loan data. They are not independent replications.</text></svg>