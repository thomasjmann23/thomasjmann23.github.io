<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="t d"><title id="t">Where the data comes from</title><desc id="d">Diagram of three data routes. One: the lender&#x27;s own deposit data, governed by the bank&#x27;s own programmes, limited to existing depositors. Two: uploaded PDF statements parsed by OCR or an LLM, governed by SBA&#x27;s two-month bank statement rule for 7(a) Small loans and lender policy, exposed to forged PDFs. Three: permissioned aggregator connections such as Plaid or Slope, governed by contracts because the Section 1033 rule covers consumer accounts only and is enjoined. All three feed underwriting attributes.</desc><style>
.bg{fill:#f1f1ed}.ink{fill:#16181c}.mut{fill:#50555d}.acc{fill:#2346d8}.acc2{fill:#8fa0ea}.watch{fill:#7d5300}.high{fill:#a8321f}
.rule{stroke:rgba(22,24,28,.16);stroke-width:1}.rule2{stroke:#16181c;stroke-width:1}.accs{stroke:#2346d8}.watchs{stroke:#7d5300}.inks{stroke:#16181c}.muts{stroke:#50555d}.highs{stroke:#a8321f}
.box{fill:#e7e7e2;stroke:rgba(22,24,28,.3)}.boxa{fill:rgba(35,70,216,.08);stroke:#2346d8}.boxw{fill:rgba(125,83,0,.08);stroke:#7d5300}.boxh{fill:rgba(168,50,31,.08);stroke:#a8321f}
text{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}.mono{font-family:"IBM Plex Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){.bg{fill:#1b1c20}.ink{fill:#e6e5e0}.mut{fill:#a2a5ab}.acc{fill:#93a6ff}.acc2{fill:#c9d2ff}.watch{fill:#f0c46a}.high{fill:#ff9a85}
.rule{stroke:rgba(230,229,224,.14)}.rule2,.inks{stroke:#e6e5e0}.accs{stroke:#93a6ff}.watchs{stroke:#f0c46a}.muts{stroke:#a2a5ab}.highs{stroke:#ff9a85}
.box{fill:#18191c;stroke:rgba(230,229,224,.28)}.boxa{fill:rgba(147,166,255,.1);stroke:#93a6ff}.boxw{fill:rgba(240,196,106,.1);stroke:#f0c46a}.boxh{fill:rgba(255,154,133,.1);stroke:#ff9a85}}
</style><rect class="bg" width="760" height="470" rx="6"/><text x="24" y="34" class="ink" font-size="18" font-weight="700" text-anchor="start" font-stretch="110%">Where the data comes from</text><text x="24" y="56" class="mut mono" font-size="11" font-weight="400" text-anchor="start">Three ways bank-account data reaches a small-business underwriter, and what governs each</text><rect class="boxa" x="24" y="78" width="224" height="300" rx="5"/><text x="38" y="104" class="ink" font-size="13" font-weight="700" text-anchor="start">1. Lender&#x27;s own deposit data</text><text x="38" y="132" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Borrower already banks with</text><text x="38" y="149" class="ink" font-size="11.5" font-weight="400" text-anchor="start">the lender. Transactions sit</text><text x="38" y="166" class="ink" font-size="11.5" font-weight="400" text-anchor="start">in the core system.</text><line class="rule" x1="38" y1="187" x2="234" y2="187"/><text x="38" y="209" class="mut" font-size="11.5" font-weight="400" text-anchor="start">Governed by: the bank&#x27;s own</text><text x="38" y="226" class="mut" font-size="11.5" font-weight="400" text-anchor="start">model risk, fair-lending and</text><text x="38" y="243" class="mut" font-size="11.5" font-weight="400" text-anchor="start">privacy programmes.</text><line class="rule" x1="38" y1="264" x2="234" y2="264"/><text x="38" y="286" class="mut mono" font-size="10.5" font-weight="400" text-anchor="start">Main gap</text><text x="38" y="304" class="ink" font-size="11.5" font-weight="400" text-anchor="start">No consent flow; only covers</text><text x="38" y="321" class="ink" font-size="11.5" font-weight="400" text-anchor="start">existing depositors.</text><rect class="boxw" x="268" y="78" width="224" height="300" rx="5"/><text x="282" y="104" class="ink" font-size="13" font-weight="700" text-anchor="start">2. Uploaded statements</text><text x="282" y="132" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Borrower uploads PDF bank</text><text x="282" y="149" class="ink" font-size="11.5" font-weight="400" text-anchor="start">statements; OCR or an LLM</text><text x="282" y="166" class="ink" font-size="11.5" font-weight="400" text-anchor="start">turns them into transactions.</text><line class="rule" x1="282" y1="187" x2="478" y2="187"/><text x="282" y="209" class="mut" font-size="11.5" font-weight="400" text-anchor="start">Governed by: SBA two-month</text><text x="282" y="226" class="mut" font-size="11.5" font-weight="400" text-anchor="start">statement rule for 7(a) Small;</text><text x="282" y="243" class="mut" font-size="11.5" font-weight="400" text-anchor="start">lender&#x27;s verification policy.</text><line class="rule" x1="282" y1="264" x2="478" y2="264"/><text x="282" y="286" class="mut mono" font-size="10.5" font-weight="400" text-anchor="start">Main gap</text><text x="282" y="304" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Exposed to edited or forged</text><text x="282" y="321" class="ink" font-size="11.5" font-weight="400" text-anchor="start">PDFs; slow, manual checks.</text><rect class="box" x="512" y="78" width="224" height="300" rx="5"/><text x="526" y="104" class="ink" font-size="13" font-weight="700" text-anchor="start">3. Permissioned connection</text><text x="526" y="132" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Borrower logs in through an</text><text x="526" y="149" class="ink" font-size="11.5" font-weight="400" text-anchor="start">aggregator (e.g. Plaid, Slope);</text><text x="526" y="166" class="ink" font-size="11.5" font-weight="400" text-anchor="start">data arrives by API.</text><line class="rule" x1="526" y1="187" x2="722" y2="187"/><text x="526" y="209" class="mut" font-size="11.5" font-weight="400" text-anchor="start">Governed by: contracts. The</text><text x="526" y="226" class="mut" font-size="11.5" font-weight="400" text-anchor="start">1033 rule covers consumer</text><text x="526" y="243" class="mut" font-size="11.5" font-weight="400" text-anchor="start">accounts only, and is enjoined.</text><line class="rule" x1="526" y1="264" x2="722" y2="264"/><text x="526" y="286" class="mut mono" font-size="10.5" font-weight="400" text-anchor="start">Main gap</text><text x="526" y="304" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Business accounts have no</text><text x="526" y="321" class="ink" font-size="11.5" font-weight="400" text-anchor="start">federal access right.</text><rect class="box" x="24" y="402" width="712" height="44" rx="5"/><text x="380" y="429" class="ink" font-size="11.5" font-weight="600" text-anchor="middle">Underwriting: attributes (deposits, balances, volatility, NSFs, daily-pay debt) feed a score, a rule set or an analyst</text><line class="muts" x1="136" y1="378" x2="136" y2="398" stroke-width="1.5"/><path class="mut" d="M131 394 L136 401 L141 394 Z"/><line class="muts" x1="380" y1="378" x2="380" y2="398" stroke-width="1.5"/><path class="mut" d="M375 394 L380 401 L385 394 Z"/><line class="muts" x1="624" y1="378" x2="624" y2="398" stroke-width="1.5"/><path class="mut" d="M619 394 L624 401 L629 394 Z"/></svg>