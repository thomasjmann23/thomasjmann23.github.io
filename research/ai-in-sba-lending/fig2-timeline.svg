<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="760" height="600" role="img" aria-labelledby="t d"><title id="t">Rules and launches, 2023 to 2026</title><desc id="d">Timeline from May 2023 to October 2026. Regulatory events: May 2023 SBA rules allowing lender credit scoring and lifting the SBLC licence moratorium; March 2025 SBA pauses its own AI; May 2025 Community Advantage moratorium; June 2025 SOP 50 10 8 with an SBSS minimum of 165; March 2026 SBSS sunset, citizenship rule and SBA's first AI inventory; April 2026 SR 26-2 excluding generative and agentic AI; July 2026 Regulation B disparate-impact test removed; September 2026 OIG report on SBLC defaults; October 2026 SOP 50 10 8.1. Industry events: August 2025 Casca funding with Live Oak and Huntington; April 2026 Celtic Bank selects Casca; June 2026 Lama AI funding; October 2026 Parlay and nCino integration and Colony Bank using Lama.</desc><style>
.bg{fill:#f1f1ed}.ink{fill:#16181c}.mut{fill:#50555d}.acc{fill:#2346d8}.acc2{fill:#8fa0ea}.watch{fill:#7d5300}.high{fill:#a8321f}
.rule{stroke:rgba(22,24,28,.16);stroke-width:1}.rule2{stroke:#16181c;stroke-width:1}.accs{stroke:#2346d8}.watchs{stroke:#7d5300}.inks{stroke:#16181c}.muts{stroke:#50555d}.highs{stroke:#a8321f}
.box{fill:#e7e7e2;stroke:rgba(22,24,28,.3)}.boxa{fill:rgba(35,70,216,.08);stroke:#2346d8}.boxw{fill:rgba(125,83,0,.08);stroke:#7d5300}
text{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}.mono{font-family:"IBM Plex Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){.bg{fill:#1b1c20}.ink{fill:#e6e5e0}.mut{fill:#a2a5ab}.acc{fill:#93a6ff}.acc2{fill:#c9d2ff}.watch{fill:#f0c46a}.high{fill:#ff9a85}
.rule{stroke:rgba(230,229,224,.14)}.rule2,.inks{stroke:#e6e5e0}.accs{stroke:#93a6ff}.watchs{stroke:#f0c46a}.muts{stroke:#a2a5ab}.highs{stroke:#ff9a85}
.box{fill:#18191c;stroke:rgba(230,229,224,.28)}.boxa{fill:rgba(147,166,255,.1);stroke:#93a6ff}.boxw{fill:rgba(240,196,106,.1);stroke:#f0c46a}}
</style><rect class="bg" width="760" height="600" rx="6"/><text x="24" y="34" class="ink" font-size="18" font-weight="700" text-anchor="start" font-stretch="110%">Rules and launches, 2023 to 2026</text><text x="24" y="56" class="mut mono" font-size="11" font-weight="400" text-anchor="start">SBA and regulators (left of the line) against AI launches in SBA lending (right)</text><line class="rule2" x1="380" y1="76" x2="380" y2="551"/><circle class="watch" cx="380" cy="86" r="4.5"/><text x="368" y="82" class="mut mono" font-size="10" font-weight="500" text-anchor="end">2023-05</text><text x="368" y="97" class="ink" font-size="11.5" font-weight="500" text-anchor="end">SBA rules allow lender scoring; cite 'machine learning'</text><circle class="watch" cx="380" cy="121" r="4.5"/><text x="368" y="117" class="mut mono" font-size="10" font-weight="500" text-anchor="end">2023-05</text><text x="368" y="132" class="ink" font-size="11.5" font-weight="500" text-anchor="end">41-year moratorium on new SBLC licences lifted</text><circle class="watch" cx="380" cy="156" r="4.5"/><text x="368" y="152" class="mut mono" font-size="10" font-weight="500" text-anchor="end">2025-03</text><text x="368" y="167" class="ink" font-size="11.5" font-weight="500" text-anchor="end">SBA pauses nearly all of its own AI use</text><circle class="watch" cx="380" cy="191" r="4.5"/><text x="368" y="187" class="mut mono" font-size="10" font-weight="500" text-anchor="end">2025-05</text><text x="368" y="202" class="ink" font-size="11.5" font-weight="500" text-anchor="end">Community Advantage licence moratorium</text><circle class="watch" cx="380" cy="226" r="4.5"/><text x="368" y="222" class="mut mono" font-size="10" font-weight="500" text-anchor="end">2025-06</text><text x="368" y="237" class="ink" font-size="11.5" font-weight="500" text-anchor="end">SOP 50 10 8: tighter criteria; SBSS minimum 165</text><circle class="acc" cx="380" cy="261" r="4.5"/><text x="392" y="257" class="mut mono" font-size="10" font-weight="500" text-anchor="start">2025-08</text><text x="392" y="272" class="ink" font-size="11.5" font-weight="500" text-anchor="start">Casca raises $29M; Live Oak, Huntington invest</text><circle class="watch" cx="380" cy="296" r="4.5"/><text x="368" y="292" class="mut mono" font-size="10" font-weight="500" text-anchor="end">2026-03</text><text x="368" y="307" class="ink" font-size="11.5" font-weight="500" text-anchor="end">SBSS sunset; citizenship rule; first AI inventory</text><circle class="watch" cx="380" cy="331" r="4.5"/><text x="368" y="327" class="mut mono" font-size="10" font-weight="500" text-anchor="end">2026-04</text><text x="368" y="342" class="ink" font-size="11.5" font-weight="500" text-anchor="end">SR 26-2: gen and agentic AI out of scope</text><circle class="acc" cx="380" cy="366" r="4.5"/><text x="392" y="362" class="mut mono" font-size="10" font-weight="500" text-anchor="start">2026-04</text><text x="392" y="377" class="ink" font-size="11.5" font-weight="500" text-anchor="start">Celtic Bank selects Casca for SBA lending</text><circle class="acc" cx="380" cy="401" r="4.5"/><text x="392" y="397" class="mut mono" font-size="10" font-weight="500" text-anchor="start">2026-06</text><text x="392" y="412" class="ink" font-size="11.5" font-weight="500" text-anchor="start">Lama AI raises $10M; plans SBA expansion</text><circle class="watch" cx="380" cy="436" r="4.5"/><text x="368" y="432" class="mut mono" font-size="10" font-weight="500" text-anchor="end">2026-07</text><text x="368" y="447" class="ink" font-size="11.5" font-weight="500" text-anchor="end">Reg B disparate-impact test removed</text><circle class="watch" cx="380" cy="471" r="4.5"/><text x="368" y="467" class="mut mono" font-size="10" font-weight="500" text-anchor="end">2026-09</text><text x="368" y="482" class="ink" font-size="11.5" font-weight="500" text-anchor="end">OIG: SBLC default rate 14.97% vs 9.79%</text><circle class="watch" cx="380" cy="506" r="4.5"/><text x="368" y="502" class="mut mono" font-size="10" font-weight="500" text-anchor="end">2026-10</text><text x="368" y="517" class="ink" font-size="11.5" font-weight="500" text-anchor="end">SOP 50 10 8.1 effective; no offshore LSPs</text><circle class="acc" cx="380" cy="541" r="4.5"/><text x="392" y="537" class="mut mono" font-size="10" font-weight="500" text-anchor="start">2026-10</text><text x="392" y="552" class="ink" font-size="11.5" font-weight="500" text-anchor="start">Parlay + nCino SBA intake; Colony uses Lama</text><circle class="watch" cx="30" cy="577" r="4.5"/><text x="42" y="581" class="mut mono" font-size="10.5" font-weight="400" text-anchor="start">SBA, regulators, OIG</text><circle class="acc" cx="220" cy="577" r="4.5"/><text x="232" y="581" class="mut mono" font-size="10.5" font-weight="400" text-anchor="start">Lender or vendor launch (company statements)</text></svg>