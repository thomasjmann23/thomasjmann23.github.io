tart">Other lenders</text><rect class="acc" x="250" y="358" width="47.2" height="19" rx="3" /><text x="304.16" y="372" class="ink mono" font-size="11" font-weight="600" text-anchor="start">2.62%</text><text x="24" y="424" class="mut mono" font-size="10.5" font-weight="400" text-anchor="start">PPP ran under 7(a) authority but carried no lender credit risk. SBLC data as of March 31, 2025.</text></svg>