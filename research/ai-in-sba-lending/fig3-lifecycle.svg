<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="t d"><title id="t">Where AI shows up in an SBA loan, and the rule that governs it</title><desc id="d">Five-stage map of the SBA 7(a) and 504 loan lifecycle: intake, eligibility, underwriting, closing, servicing. For each stage, the upper box lists AI uses that lenders, vendors or SBA have described in public, and the lower box lists the SBA requirement that applies. Intake: guided SBA forms and borrower chat; a vendor that pre-qualifies is a Lender Service Provider. Eligibility: automated screens; CAIVRS, SAM and citizenship checks, and a credit score alone cannot show credit is unavailable elsewhere. Underwriting: spreading and lender scoring models; models must sit on top of the lender's own analysis, with a 1.10 debt service floor for 7(a) Small. Closing: document and lien automation; IRS transcripts must be reconciled. Servicing: portfolio monitoring and SBA oversight analytics; servicing must be commercially reasonable. Across all stages the lender, not the vendor, is responsible.</desc><style>
.bg{fill:#f1f1ed}.ink{fill:#16181c}.mut{fill:#50555d}.acc{fill:#2346d8}.acc2{fill:#8fa0ea}.watch{fill:#7d5300}.high{fill:#a8321f}
.rule{stroke:rgba(22,24,28,.16);stroke-width:1}.rule2{stroke:#16181c;stroke-width:1}.accs{stroke:#2346d8}.watchs{stroke:#7d5300}.inks{stroke:#16181c}.muts{stroke:#50555d}.highs{stroke:#a8321f}
.box{fill:#e7e7e2;stroke:rgba(22,24,28,.3)}.boxa{fill:rgba(35,70,216,.08);stroke:#2346d8}.boxw{fill:rgba(125,83,0,.08);stroke:#7d5300}
text{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}.mono{font-family:"IBM Plex Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){.bg{fill:#1b1c20}.ink{fill:#e6e5e0}.mut{fill:#a2a5ab}.acc{fill:#93a6ff}.acc2{fill:#c9d2ff}.watch{fill:#f0c46a}.high{fill:#ff9a85}
.rule{stroke:rgba(230,229,224,.14)}.rule2,.inks{stroke:#e6e5e0}.accs{stroke:#93a6ff}.watchs{stroke:#f0c46a}.muts{stroke:#a2a5ab}.highs{stroke:#ff9a85}
.box{fill:#18191c;stroke:rgba(230,229,224,.28)}.boxa{fill:rgba(147,166,255,.1);stroke:#93a6ff}.boxw{fill:rgba(240,196,106,.1);stroke:#f0c46a}}
</style><rect class="bg" width="760" height="560" rx="6"/><text x="24" y="34" class="ink" font-size="18" font-weight="700" text-anchor="start" font-stretch="110%">Where AI shows up in an SBA loan, and the rule that governs it</text><text x="24" y="56" class="mut mono" font-size="11" font-weight="400" text-anchor="start">Public deployments by stage (top) against the SBA requirement each one has to satisfy (bottom)</text><rect class="boxa" x="24" y="76" width="136" height="34" rx="3" /><text x="92.0" y="98" class="ink" font-size="13" font-weight="700" text-anchor="middle" font-stretch="105%">1  Intake</text><path class="accs" d="M161 93 l4 0" stroke-width="1.4" fill="none"/><text x="32" y="134" class="acc mono" font-size="9.5" font-weight="600" text-anchor="start">AI IN USE (PUBLIC)</text><rect class="box" x="24" y="142" width="136" height="150" rx="3" /><text x="33" y="162" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Guided Forms 1919,</text><text x="33" y="183" class="ink" font-size="11.5" font-weight="400" text-anchor="start">413, 159 (Casca)</text><text x="33" y="204" class="ink" font-size="11.5" font-weight="400" text-anchor="start">24/7 borrower chat</text><text x="33" y="225" class="ink" font-size="11.5" font-weight="400" text-anchor="start">(Huntington, planned)</text><text x="33" y="246" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Intake + eligibility</text><text x="33" y="267" class="ink" font-size="11.5" font-weight="400" text-anchor="start">triage (Parlay)</text><text x="32" y="318" class="watch mono" font-size="9.5" font-weight="600" text-anchor="start">SBA RULE IT MEETS</text><rect class="boxw" x="24" y="326" width="136" height="150" rx="3" /><text x="33" y="346" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Vendor that pre-</text><text x="33" y="367" class="ink" font-size="11.5" font-weight="400" text-anchor="start">qualifies = LSP:</text><text x="33" y="388" class="ink" font-size="11.5" font-weight="400" text-anchor="start">SBA-reviewed</text><text x="33" y="409" class="ink" font-size="11.5" font-weight="400" text-anchor="start">agreement; U.S.-</text><text x="33" y="430" class="ink" font-size="11.5" font-weight="400" text-anchor="start">located from</text><text x="33" y="451" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Oct 1, 2026</text><rect class="boxa" x="166" y="76" width="136" height="34" rx="3" /><text x="234.0" y="98" class="ink" font-size="13" font-weight="700" text-anchor="middle" font-stretch="105%">2  Eligibility</text><path class="accs" d="M303 93 l4 0" stroke-width="1.4" fill="none"/><text x="174" y="134" class="acc mono" font-size="9.5" font-weight="600" text-anchor="start">AI IN USE (PUBLIC)</text><rect class="box" x="166" y="142" width="136" height="150" rx="3" /><text x="175" y="162" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Automated screens</text><text x="175" y="183" class="ink" font-size="11.5" font-weight="400" text-anchor="start">(SBA's own Risk</text><text x="175" y="204" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Mitigation</text><text x="175" y="225" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Framework)</text><text x="175" y="246" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Do Not Pay checks</text><text x="175" y="267" class="ink" font-size="11.5" font-weight="400" text-anchor="start">(being added)</text><text x="174" y="318" class="watch mono" font-size="9.5" font-weight="600" text-anchor="start">SBA RULE IT MEETS</text><rect class="boxw" x="166" y="326" width="136" height="150" rx="3" /><text x="175" y="346" class="ink" font-size="11.5" font-weight="400" text-anchor="start">CAIVRS, SAM.gov,</text><text x="175" y="367" class="ink" font-size="11.5" font-weight="400" text-anchor="start">SAFER checks;</text><text x="175" y="388" class="ink" font-size="11.5" font-weight="400" text-anchor="start">100% of owners</text><text x="175" y="409" class="ink" font-size="11.5" font-weight="400" text-anchor="start">U.S. citizens;</text><text x="175" y="430" class="ink" font-size="11.5" font-weight="400" text-anchor="start">a failed score is</text><text x="175" y="451" class="ink" font-size="11.5" font-weight="400" text-anchor="start">not credit elsewhere</text><rect class="boxa" x="308" y="76" width="136" height="34" rx="3" /><text x="376.0" y="98" class="ink" font-size="13" font-weight="700" text-anchor="middle" font-stretch="105%">3  Underwriting</text><path class="accs" d="M445 93 l4 0" stroke-width="1.4" fill="none"/><text x="316" y="134" class="acc mono" font-size="9.5" font-weight="600" text-anchor="start">AI IN USE (PUBLIC)</text><rect class="box" x="308" y="142" width="136" height="150" rx="3" /><text x="317" y="162" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Spreading and</text><text x="317" y="183" class="ink" font-size="11.5" font-weight="400" text-anchor="start">analysis (Casca,</text><text x="317" y="204" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Lama, NewTracker)</text><text x="317" y="225" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Lender scoring</text><text x="317" y="246" class="ink" font-size="11.5" font-weight="400" text-anchor="start">models (7(a) Small</text><text x="317" y="267" class="ink" font-size="11.5" font-weight="400" text-anchor="start">since Mar 2026)</text><text x="316" y="318" class="watch mono" font-size="9.5" font-weight="600" text-anchor="start">SBA RULE IT MEETS</text><rect class="boxw" x="308" y="326" width="136" height="150" rx="3" /><text x="317" y="346" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Own non-SBA</text><text x="317" y="367" class="ink" font-size="11.5" font-weight="400" text-anchor="start">procedures; model</text><text x="317" y="388" class="ink" font-size="11.5" font-weight="400" text-anchor="start">only on top of</text><text x="317" y="409" class="ink" font-size="11.5" font-weight="400" text-anchor="start">analysis; score in</text><text x="317" y="430" class="ink" font-size="11.5" font-weight="400" text-anchor="start">memo; DSCR 1.10x;</text><text x="317" y="451" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Express: validate</text><rect class="boxa" x="450" y="76" width="136" height="34" rx="3" /><text x="518.0" y="98" class="ink" font-size="13" font-weight="700" text-anchor="middle" font-stretch="105%">4  Closing</text><path class="accs" d="M587 93 l4 0" stroke-width="1.4" fill="none"/><text x="458" y="134" class="acc mono" font-size="9.5" font-weight="600" text-anchor="start">AI IN USE (PUBLIC)</text><rect class="box" x="450" y="142" width="136" height="150" rx="3" /><text x="459" y="162" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Document review,</text><text x="459" y="183" class="ink" font-size="11.5" font-weight="400" text-anchor="start">lien filing, credit</text><text x="459" y="204" class="ink" font-size="11.5" font-weight="400" text-anchor="start">package assembly</text><text x="459" y="225" class="ink" font-size="11.5" font-weight="400" text-anchor="start">(NewTracker, per</text><text x="459" y="246" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Newtek)</text><text x="459" y="267" class="ink" font-size="11.5" font-weight="400" text-anchor="start"></text><text x="458" y="318" class="watch mono" font-size="9.5" font-weight="600" text-anchor="start">SBA RULE IT MEETS</text><rect class="boxw" x="450" y="326" width="136" height="150" rx="3" /><text x="459" y="346" class="ink" font-size="11.5" font-weight="400" text-anchor="start">IRS transcripts</text><text x="459" y="367" class="ink" font-size="11.5" font-weight="400" text-anchor="start">reconciled before</text><text x="459" y="388" class="ink" font-size="11.5" font-weight="400" text-anchor="start">disbursement;</text><text x="459" y="409" class="ink" font-size="11.5" font-weight="400" text-anchor="start">failure risks</text><text x="459" y="430" class="ink" font-size="11.5" font-weight="400" text-anchor="start">repair or denial</text><text x="459" y="451" class="ink" font-size="11.5" font-weight="400" text-anchor="start">(13 CFR 120.524)</text><rect class="boxa" x="592" y="76" width="136" height="34" rx="3" /><text x="660.0" y="98" class="ink" font-size="13" font-weight="700" text-anchor="middle" font-stretch="105%">5  Servicing</text><text x="600" y="134" class="acc mono" font-size="9.5" font-weight="600" text-anchor="start">AI IN USE (PUBLIC)</text><rect class="box" x="592" y="142" width="136" height="150" rx="3" /><text x="601" y="162" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Portfolio</text><text x="601" y="183" class="ink" font-size="11.5" font-weight="400" text-anchor="start">monitoring (Lama,</text><text x="601" y="204" class="ink" font-size="11.5" font-weight="400" text-anchor="start">claimed)</text><text x="601" y="225" class="ink" font-size="11.5" font-weight="400" text-anchor="start">SBA: AI in L/LMS</text><text x="601" y="246" class="ink" font-size="11.5" font-weight="400" text-anchor="start">oversight portal;</text><text x="601" y="267" class="ink" font-size="11.5" font-weight="400" text-anchor="start">purchase-review ML</text><text x="600" y="318" class="watch mono" font-size="9.5" font-weight="600" text-anchor="start">SBA RULE IT MEETS</text><rect class="boxw" x="592" y="326" width="136" height="150" rx="3" /><text x="601" y="346" class="ink" font-size="11.5" font-weight="400" text-anchor="start">Commercially</text><text x="601" y="367" class="ink" font-size="11.5" font-weight="400" text-anchor="start">reasonable, no less</text><text x="601" y="388" class="ink" font-size="11.5" font-weight="400" text-anchor="start">diligent than non-</text><text x="601" y="409" class="ink" font-size="11.5" font-weight="400" text-anchor="start">SBA loans (SOP</text><text x="601" y="430" class="ink" font-size="11.5" font-weight="400" text-anchor="start">50 57 4); lender</text><text x="601" y="451" class="ink" font-size="11.5" font-weight="400" text-anchor="start">keeps liability</text><line class="rule" x1="24" y1="496" x2="736" y2="496"/><text x="24" y="516" class="ink" font-size="11.5" font-weight="600" text-anchor="start">Across every stage: 'the 7(a) Lender itself, not the LSP, bears full responsibility' (SOP 50 10 8.1).</text><text x="24" y="538" class="mut mono" font-size="10.5" font-weight="400" text-anchor="start">AI uses are company statements or SBA statements as reported; none has been independently measured.</text></svg>