.rule{stroke:rgba(230,229,224,.14)}.rule2,.inks{stroke:#e6e5e0}.accs{stroke:#93a6ff}.watchs{stroke:#f0c46a}.muts{stroke:#a2a5ab}.highs{stroke:#ff9a85}
.box{fill:#18191c;stroke:rgba(230,229,224,.28)}.boxa{fill:rgba(147,166,255,.1);stroke:#93a6ff}}
</style><rect class="bg" width="680" height="464" rx="6"/><text x="24.0" y="34.0" class="ink" font-size="19" font-weight="700" text-anchor="start" font-stretch="112%">Where the AI sits in the loan</text><text x="24.0" y="56.0" class="mut mono" font-size="12" font-weight="400" text-anchor="start" >Uses stated in public sources, by deployment</text><text x="279.0" y="88.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >Borrower</text><text x="279.0" y="102.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >prep</text><text x="337.0" y="88.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >Intake</text><text x="337.0" y="102.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >/ chat</text><text x="395.0" y="88.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >Forms</text><text x="395.0" y="102.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >&amp; docs</text><text x="453.0" y="88.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >Spreading</text><text x="511.0" y="88.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >Risk</text><text x="511.0" y="102.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >/ offer</text><text x="569.0" y="88.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >Credit</text><text x="569.0" y="102.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >decision</text><text x="627.0" y="88.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >Internal</text><text x="627.0" y="102.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >search</text><line class="rule2" x1="24" y1="118" x2="656" y2="118"/><text x="24.0" y="151.0" class="acc" font-size="12" font-weight="600" text-anchor="start" >Live Oak + Casca (pilot)</text><circle class="acc" cx="337.