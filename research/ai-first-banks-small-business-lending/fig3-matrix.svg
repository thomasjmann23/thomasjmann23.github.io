ink" cx="511.0" cy="375.0" r="6"/><line class="rule" x1="24" y1="394.0" x2="656" y2="394.0"/><circle class="ink" cx="30" cy="416" r="6"/><text x="42.0" y="420.0" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >stated use</text><circle class="bg inks" cx="150" cy="416" r="5.5" stroke-width="1.4"/><text x="162.0" y="420.0" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >&quot;SBA origination&quot;, steps not named</text><text x="440.0" y="420.0" class="watch mono" font-size="11" font-weight="600" text-anchor="start" >human</text><text x="488.0" y="420.0" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >= stated human decision</text><text x="24.0" y="442.0" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >Blank = no public source states the use. It does not mean the bank does not do it.</text></svg>