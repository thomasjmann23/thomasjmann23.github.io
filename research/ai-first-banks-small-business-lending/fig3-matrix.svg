<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 464" width="680" height="464" role="img" aria-labelledby="t d"><title id="t">Loan stages covered by each AI deployment</title><desc id="d">Matrix. Live Oak with Casca (pilot): intake, forms and documents, spreading; credit decision stated to stay with a human. Huntington with Casca (planned): intake and chat. Huntington 1866 Studio: borrower preparation. Celtic with Casca: intake, forms and documents, spreading. Colony with Lama AI: SBA origination, steps not named. ConnectOne with nCino: documents and internal search. Grasshopper with Lendio and Enfi: intake and offers, risk assessment.</desc><style>
.bg{fill:#f1f1ed}.ink{fill:#16181c}.mut{fill:#50555d}.acc{fill:#2346d8}.acc2{fill:#8fa0ea}.watch{fill:#7d5300}.high{fill:#a8321f}
