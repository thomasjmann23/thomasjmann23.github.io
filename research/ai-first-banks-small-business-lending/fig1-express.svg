<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" role="img" aria-labelledby="t d"><title id="t">Live Oak Express originations against targets</title><desc id="d">Bar chart. Live Oak Express small-dollar SBA 7(a) originations: $38 million in Q4 2025, $56 million in Q1 2026, $82 million in Q2 2026; Q3 2026 not disclosed. Dashed lines show 2026 guidance of about $300 million (about $75 million a quarter) and a target of at least $750 million a year (about $188 million a quarter).</desc><style>
