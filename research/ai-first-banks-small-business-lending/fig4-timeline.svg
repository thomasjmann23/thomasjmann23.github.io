<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 418" width="680" height="418" role="img" aria-labelledby="t d"><title id="t">Timeline of AI small-business lending milestones</title><desc id="d">Timeline. Feb 2024 Casca pre-seed with Bankwell as first customer. Aug 2025 Casca 29 million dollar Series A with Live Oak and Huntington investing. Mar 2026 SBA stops SBSS for 7(a) Small Loans. Apr 2026 Live Oak pilot and Celtic selects Casca. Jun 2026 Lama AI Series A naming bank clients. Jul 2026 Live Oak closes pilot loans and ConnectOne live on nCino. Oct 2026 SOP 50 10 8.1, Colony on Lama, Huntington 1866 Studio. Dec 2026 target for full Live Oak Express rollout.</desc><style>
.bg{fill:#f1f1ed}.ink{fill:#16181c}.mut{fill:#50555d}.acc{fill:#2346d8}.acc2{fill:#8fa0ea}.watch{fill:#7d5300}.high{fill:#a8321f}
.rule{stroke:rgba(22,24,28,.16);stroke-width:1}.rule2{stroke:#16181c;stroke-width:1}.accs{stroke:#2346d8}.watchs{stroke:#7d5300}.inks{stroke:#16181c}.muts{stroke:#50555d}.highs{stroke:#a8321f}
.box{fill:#e7e7e2;stroke:rgba(22,24,28,.3)}.boxa{fill:rgba(35,70,216,.08);stroke:#2346d8}
text{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}.mono{font-family:"IBM Plex Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){.bg{fill:#1b1c20}.ink{fill:#e6e5e0}.mut{fill:#a2a5ab}.acc{fill:#93a6ff}.acc2{fill:#c9d2ff}.watch{fill:#f0c46a}.high{fill:#ff9a85}
.rule{stroke:rgba(230,229,224,.14)}.rule2,.inks{stroke:#e6e5e0}.accs{stroke:#93a6ff}.watchs{stroke:#f0c46a}.muts{stroke:#a2a5ab}.highs{stroke:#ff9a85}
.box{fill:#18191c;stroke:rgba(230,229,224,.28)}.boxa{fill:rgba(147,166,255,.1);stroke:#93a6ff}}
</style><rect class="bg" width="680" height="418" rx="6"/><text x="24.0" y="34.0" class="ink" font-size="19" font-weight="700" text-anchor="start" font-stretch="112%">From pre-seed to pilot</text><text x="24.0" y="56.0" class="mut mono" font-size="12" font-weight="400" text-anchor="start" >Public milestones in AI small-business lending, 2024 to 2026</text><line class="rule2" x1="120" y1="84" x2="120" y2="330"/><line class="watchs" x1="120" y1="330" x2="120" y2="342" stroke-dasharray="3 3"/><text x="104.0" y="94.0" class="acc mono" font-size="11" font-weight="600" text-anchor="end" >Feb 2024</text><circle class="acc" cx="120" cy="90" r="5.5"/><text x="138.0" y="94.0" class="ink" font-size="12.5" font-weight="400" text-anchor="start" >Casca pre-seed ($3.9M); Bankwell named first customer</text><text x="104.0" y="130.0" class="acc mono" font-size="11" font-weight="600" text-anchor="end" >Aug 2025</text><circle class="acc" cx="120" cy="126" r="5.5"/><text x="138.0" y="130.0" class="ink" font-size="12.5" font-weight="400" text-anchor="start" >Casca Series A ($29M); Live Oak and Huntington invest and plan rollouts</text><text x="104.0" y="166.0" class="mut mono" font-size="11" font-weight="600" text-anchor="end" >Mar 2026</text><circle class="mut" cx="120" cy="162" r="5.5"/><text x="138.0" y="166.0" class="mut" font-size="12.5" font-weight="400" text-anchor="start" >SBA stops returning SBSS scores for 7(a) Small Loans</text><text x="104.0" y="202.0" class="acc mono" font-size="11" font-weight="600" text-anchor="end" >Apr 2026</text><circle class="acc" cx="120" cy="198" r="5.5"/><text x="138.0" y="202.0" class="ink" font-size="12.5" font-weight="400" text-anchor="start" >Live Oak in pilot with Casca; Celtic Bank selects Casca</text><text x="104.0" y="238.0" class="acc mono" font-size="11" font-weight="600" text-anchor="end" >Jun 2026</text><circle class="acc" cx="120" cy="234" r="5.5"/><text x="138.0" y="238.0" class="ink" font-size="12.5" font-weight="400" text-anchor="start" >Lama AI Series A names six bank clients</text><text x="104.0" y="274.0" class="acc mono" font-size="11" font-weight="600" text-anchor="end" >Jul 2026</text><circle class="acc" cx="120" cy="270" r="5.5"/><text x="138.0" y="274.0" class="ink" font-size="12.5" font-weight="400" text-anchor="start" >Live Oak has closed pilot loans; ConnectOne live on nCino agents</text><text x="104.0" y="310.0" class="acc mono" font-size="11" font-weight="600" text-anchor="end" >Oct 2026</text><circle class="acc" cx="120" cy="306" r="5.5"/><text x="138.0" y="310.0" class="ink" font-size="12.5" font-weight="400" text-anchor="start" >SOP 50 10 8.1 in force; Colony on Lama AI; Huntington 1866 Studio</text><text x="104.0" y="346.0" class="watch mono" font-size="11" font-weight="600" text-anchor="end" >Dec 2026</text><circle class="bg watchs" cx="120" cy="342" r="5.5" stroke-width="1.6"/><text x="138.0" y="346.0" class="ink" font-size="12.5" font-weight="400" text-anchor="start" >Live Oak target: full Express rollout on Casca</text><text x="24.0" y="404.0" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >Blue: bank or vendor milestone. Grey: SBA rule. Open: target, not confirmed.</text></svg>