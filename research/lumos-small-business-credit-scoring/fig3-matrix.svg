<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 468" width="680" height="468" role="img" aria-labelledby="t d"><title id="t">Data used by small-business scores</title><desc id="d">Matrix. FICO SBSS: owner consumer credit, business bureau, financial statements. Experian Intelliscore Plus: business bureau. D&amp;B: business bureau. Equifax: business bureau, owner consumer optional. Moody's RiskCalc: financial statements, plus market and cycle data. Lumos Prime+: owner consumer score and loan history plus macro data. Experian Cashflow Attributes: bank transactions. Square Loans: payment data.</desc><style>
.bg{fill:#f1f1ed}.ink{fill:#16181c}.mut{fill:#50555d}.acc{fill:#2346d8}.ocr{fill:#50555d}.ocr2{fill:#9a9ea5}.acc2{fill:#8fa0ea}.watch{fill:#7d5300}
.rule{stroke:rgba(22,24,28,.16);stroke-width:1}.rule2{stroke:#16181c;stroke-width:1}.accs{stroke:#2346d8}.watchs{stroke:#7d5300}.inks{stroke:#16181c}.muts{stroke:#50555d}
.box{fill:#e7e7e2;stroke:rgba(22,24,28,.3)}.boxa{fill:rgba(35,70,216,.08);stroke:#2346d8}
text{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}.mono{font-family:"IBM Plex Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){.bg{fill:#1b1c20}.ink{fill:#e6e5e0}.mut,.ocr{fill:#a2a5ab}.ocr2{fill:#d4d6da}.acc{fill:#93a6ff}.acc2{fill:#c9d2ff}.watch{fill:#f0c46a}
.rule{stroke:rgba(230,229,224,.14)}.rule2,.inks{stroke:#e6e5e0}.accs{stroke:#93a6ff}.watchs{stroke:#f0c46a}.muts{stroke:#a2a5ab}
.box{fill:#18191c;stroke:rgba(230,229,224,.28)}.boxa{fill:rgba(147,166,255,.1);stroke:#93a6ff}}
</style><rect class="bg" width="680" height="468" rx="6"/><text x="24" y="34" class="ink" font-size="19" font-weight="700" text-anchor="start" font-stretch="112%">What each score is built on</text><text x="24" y="56" class="mut mono" font-size="12" font-weight="400" text-anchor="start" >Data sources as described by the provider or cited source.</text><text x="329.0" y="90" class="mut mono" font-size="11" font-weight="400" text-anchor="middle" >Owner</text><text x="329.0" y="104" class="mut mono" font-size="11" font-weight="400" text-anchor="middle" >consumer</text><text x="407.0" y="90" class="mut mono" font-size="11" font-weight="400" text-anchor="middle" >Business</text><text x="407.0" y="104" class="mut mono" font-size="11" font-weight="400" text-anchor="middle" >bureau</text><text x="485.0" y="90" class="mut mono" font-size="11" font-weight="400" text-anchor="middle" >Financial</text><text x="485.0" y="104" class="mut mono" font-size="11" font-weight="400" text-anchor="middle" >statements</text><text x="563.0" y="90" class="mut mono" font-size="11" font-weight="400" text-anchor="middle" >Bank /</text><text x="563.0" y="104" class="mut mono" font-size="11" font-weight="400" text-anchor="middle" >payments</text><text x="641.0" y="90" class="mut mono" font-size="11" font-weight="400" text-anchor="middle" >Loan hist.</text><text x="641.0" y="104" class="mut mono" font-size="11" font-weight="400" text-anchor="middle" >+ macro</text><line class="rule" x1="24" y1="120" x2="656" y2="120"/><text x="24" y="143" class="ink" font-size="13" font-weight="500" text-anchor="start" >FICO SBSS</text><circle class="ink" cx="329.0" cy="138" r="6"/><circle class="ink" cx="407.0" cy="138" r="6"/><circle class="ink" cx="485.0" cy="138" r="6"/><line class="rule" x1="24" y1="156" x2="656" y2="156"/><text x="24" y="179" class="ink" font-size="13" font-weight="500" text-anchor="start" >Experian Intelliscore Plus</text><circle class="ink" cx="407.0" cy="174" r="6"/><line class="rule" x1="24" y1="192" x2="656" y2="192"/><text x="24" y="215" class="ink" font-size="13" font-weight="500" text-anchor="start" >D&amp;B Delinquency / Failure</text><circle class="ink" cx="407.0" cy="210" r="6"/><line class="rule" x1="24" y1="228" x2="656" y2="228"/><text x="24" y="251" class="ink" font-size="13" font-weight="500" text-anchor="start" >Equifax business scores</text><circle class="bg inks" cx="329.0" cy="246" r="5.5" stroke-width="1.4"/><circle class="ink" cx="407.0" cy="246" r="6"/><line class="rule" x1="24" y1="264" x2="656" y2="264"/><text x="24" y="287" class="ink" font-size="13" font-weight="500" text-anchor="start" >Moody's RiskCalc</text><circle class="ink" cx="485.0" cy="282" r="6"/><circle class="ink" cx="641.0" cy="282" r="6"/><line class="rule" x1="24" y1="300" x2="656" y2="300"/><text x="24" y="323" class="acc" font-size="13" font-weight="700" text-anchor="start" >Lumos Prime+</text><circle class="acc" cx="329.0" cy="318" r="6"/><circle class="acc" cx="641.0" cy="318" r="6"/><line class="rule" x1="24" y1="336" x2="656" y2="336"/><text x="24" y="359" class="ink" font-size="13" font-weight="500" text-anchor="start" >Experian Cashflow Attributes</text><circle class="ink" cx="563.0" cy="354" r="6"/><line class="rule" x1="24" y1="372" x2="656" y2="372"/><text x="24" y="395" class="ink" font-size="13" font-weight="500" text-anchor="start" >Square Loans</text><circle class="ink" cx="563.0" cy="390" r="6"/><line class="rule" x1="24" y1="408" x2="656" y2="408"/><circle class="ink" cx="30" cy="440" r="6"/><text x="42" y="444" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >used</text><circle class="bg inks" cx="100" cy="440" r="5.5" stroke-width="1.4"/><text x="112" y="444" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >optional / some versions</text><text x="330" y="444" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >blank = not stated by source</text></svg>