</style><rect class="bg" width="680" height="460" rx="6"/><text x="24" y="34" class="ink" font-size="19" font-weight="700" text-anchor="start" font-stretch="112%">Lumos, as publicly described</text><text x="24" y="56" class="mut mono" font-size="12" font-weight="400" text-anchor="start" >As stated by Lumos, partners and press.</text><text x="24" y="90" class="mut mono" font-size="11" font-weight="500" text-anchor="start" >INPUTS</text><rect class="box" x="24" y="100" width="190" height="190" rx="4"/><text x="34" y="120" class="ink" font-size="13" font-weight="600" text-anchor="start" >Data</text><text x="34" y="138" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >~30 yrs loan history</text><text x="34" y="153" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >~2M small-biz loans</text><text x="34" y="168" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >economic conditions</text><text x="34" y="183" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >industry performance</text><text x="34" y="198" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >lender application data</text><text x="34" y="213" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >owner credit score</text><text x="34" y="228" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >employee count</text><text x="34" y="243" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >bank data: not stated</text><text x="244" y="90" class="acc mono" font-size="11" font-weight="500" text-anchor="start" >MODEL</text><rect class="boxa" x="244" y="100" width="190" height="90" rx="4"/><text x="254" y="120" class="ink" font-size="13" font-weight="600" text-anchor="start" >Machine learning</text><text x="254" y="138" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >PD x LGD</text><text x="254" y="153" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >= 12-month</text><text x="254" y="168" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >expected loss</text><rect class="box" x="244" y="200" width="190" height="90" rx="4"/><text x="254" y="220" class="ink" font-size="13" font-weight="600" text-anchor="start" >Not disclosed</text><text x="254" y="238" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >algorithm, metrics,</text><text x="254" y="253" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >validation sample,</text><text x="254" y="268" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >reason-code method</text><line class="muts" x1="214" y1="145" x2="238" y2="145" stroke-width="1.3"/><path class="muts" d="M237,141 L244,145 L237,149" fill="none" stroke-width="1.3"/><text x="464" y="90" class="mut mono" font-size="11" font-weight="500" text-anchor="start" >PRODUCTS</text><rect class="box" x="464" y="100" width="192" height="40" rx="4"/><text x="474" y="117" class="ink" font-size="13" font-weight="600" text-anchor="start" >Prime+ score</text><text x="474" y="132" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >origination, &lt;$500K</text><rect class="box" x="464" y="148" width="192" height="40" rx="4"/><text x="474" y="165" class="ink" font-size="13" font-weight="600" text-anchor="start" >Portfolio Score</text><text x="474" y="180" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >rescore, alerts</text><rect class="box" x="464" y="196" width="192" height="40" rx="4"/><text x="474" y="213" class="ink" font-size="13" font-weight="600" text-anchor="start" >Business Report</text><text x="474" y="228" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >memo narrative</text><rect class="box" x="464" y="244" width="192" height="40" rx="4"/><text x="474" y="261" class="ink" font-size="13" font-weight="600" text-anchor="start" >SBA reports</text><text x="474" y="276" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >quarterly, by NAICS</text><line class="accs" x1="434" y1="145" x2="458" y2="145" stroke-width="1.3"/><path class="accs" d="M457,141 L464,145 L457,149" fill="none" stroke-width="1.3"/><line class="rule2" x1="24" y1="318" x2="656" y2="318"/><text x="24" y="342" class="mut mono" font-size="11" font-weight="500" text-anchor="start" >DELIVERED VIA API INSIDE PARTNER PLATFORMS</text><rect class="box" x="24" y="356" width="172" height="28" rx="3"/><text x="34" y="375" class="ink" font-size="12" font-weight="500" text-anchor="start" >Lenders Cooperative</text><rect class="box" x="206" y="356" width="60" height="28" rx="3"/><text x="216" y="375" class="ink" font-size="12" font-weight="500" text-anchor="start" >nCino</text><rect class="box" x="276" y="356" width="100" height="28" rx="3"/><text x="286" y="375" class="ink" font-size="12" font-weight="500" text-anchor="start" >Baker Hill</text><rect class="box" x="386" y="356" width="60" height="28" rx="3"/><text x="396" y="375" class="ink" font-size="12" font-weight="500" text-anchor="start" >SPARK</text><rect class="box" x="456" y="356" width="76" height="28" rx="3"/><text x="466" y="375" class="ink" font-size="12" font-weight="500" text-anchor="start" >Lama AI</text><rect class="box" x="542" y="356" width="108" height="28" rx="3"/><text x="552" y="375" class="ink" font-size="12" font-weight="500" text-anchor="start" >Vertical IQ</text><text x="24" y="416" class="ink mono" font-size="12" font-weight="400" text-anchor="start" >Named bank customer: Live Oak Bank (Live Oak Express).</text><text x="24" y="436" class="mut mono" font-size="12" font-weight="400" text-anchor="start" >Claimed reach: 80+ institutions (Jul 2024), 90+ banks (Nov 2024).</text></svg>