<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="680" height="460" role="img" aria-labelledby="t d"><title id="t">Lumos as publicly described</title><desc id="d">Diagram. Inputs: about 30 years and 2 million small-business loans of history, economic and industry data, lender application data, owner credit score, employee count; bank transaction data not stated. Model: machine learning estimating probability of default times loss given default, giving 12-month expected loss; algorithm, metrics and validation not disclosed. Products: Prime+ score, Portfolio Score, Business Report, quarterly SBA reports. Delivered by API through Lenders Cooperative, nCino, Baker Hill, SPARK, Lama AI and Vertical IQ. Named customer Live Oak Bank.</desc><style>
.bg{fill:#f1f1ed}.ink{fill:#16181c}.mut{fill:#50555d}.acc{fill:#2346d8}.ocr{fill:#50555d}.ocr2{fill:#9a9ea5}.acc2{fill:#8fa0ea}.watch{fill:#7d5300}
