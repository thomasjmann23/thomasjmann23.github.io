" rx="2"/><text x="317.9" y="222.0" class="ink mono" font-size="12" font-weight="600" text-anchor="start" >C$195M</text><text x="24.0" y="273.0" class="ink" font-size="12.5" font-weight="500" text-anchor="start" >Medium-term goal (annual)</text><rect class="bg muts" x="230" y="256" width="410.0" height="26" rx="2" stroke-width="1.4" stroke-dasharray="4 3"/><text x="632.0" y="274.0" class="ink mono" font-size="12" font-weight="600" text-anchor="end" >about C$1B</text><text x="24.0" y="346.0" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >Solid: reported as delivered. Dashed: target. TD management statements, not audited.</text><text x="24.0" y="364.0" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >Press reports describe the C$1B goal as about half revenue uplift, half cost savings.</text></svg>