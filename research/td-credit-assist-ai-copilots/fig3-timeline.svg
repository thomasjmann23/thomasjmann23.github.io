<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 482" width="680" height="482" role="img" aria-labelledby="t d"><title id="t">Timeline of TD AI milestones and the rules around them</title><desc id="d">Timeline. 2018 TD acquires Layer 6. October 2024 US AML guilty plea and OCC asset cap. July 2025 TD AI Prism. September 2025 Investor Day and OSFI final Guideline E-23. December 2025 TD reports 75 AI use cases and C$170 million of value in fiscal 2025. January 2026 mortgage pre-adjudication agent deployed. April 2026 US revised model risk guidance SR 26-2 leaves generative and agentic AI out of scope. May 2026 mortgage agent announced. July 2026 OSFI technology risk bulletin on generative and agentic AI. August 2026 C$195 million of AI value in the first nine months of fiscal 2026. October 2026 TD ranked 10th in the Evident AI Index and Credit Assist launched. May 2027 E-23 takes effect.</desc><style>
.bg{fill:#f1f1ed}.ink{fill:#16181c}.mut{fill:#50555d}.acc{fill:#2346d8}.acc2{fill:#8fa0ea}.watch{fill:#7d5300}.high{fill:#a8321f}
.rule{stroke:rgba(22,24,28,.16);stroke-width:1}.rule2{stroke:#16181c;stroke-width:1}.accs{stroke:#2346d8}.watchs{stroke:#7d5300}.inks{stroke:#16181c}.muts{stroke:#50555d}.highs{stroke:#a8321f}
.box{fill:#e7e7e2;stroke:rgba(22,24,28,.3)}.boxa{fill:rgba(35,70,216,.08);stroke:#2346d8}.boxw{fill:rgba(125,83,0,.08);stroke:#7d5300}
text{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}.mono{font-family:"IBM Plex Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){.bg{fill:#1b1c20}.ink{fill:#e6e5e0}.mut{fill:#a2a5ab}.acc{fill:#93a6ff}.acc2{fill:#c9d2ff}.watch{fill:#f0c46a}.high{fill:#ff9a85}
.rule{stroke:rgba(230,229,224,.14)}.rule2,.inks{stroke:#e6e5e0}.accs{stroke:#93a6ff}.watchs{stroke:#f0c46a}.muts{stroke:#a2a5ab}.highs{stroke:#ff9a85}
.box{fill:#18191c;stroke:rgba(230,229,224,.28)}.boxa{fill:rgba(147,166,255,.1);stroke:#93a6ff}.boxw{fill:rgba(240,196,106,.1);stroke:#f0c46a}}
</style><rect class="bg" width="680" height="482" rx="6"/><text x="24.0" y="34.0" class="ink" font-size="19" font-weight="700" text-anchor="start" font-stretch="112%">From research lab to credit desk</text><text x="24.0" y="56.0" class="mut mono" font-size="12" font-weight="400" text-anchor="start" >TD AI milestones and the rules around them, 2018 to 2027</text><line class="rule2" x1="120" y1="86" x2="120" y2="428" /><text x="104.0" y="96.0" class="acc mono" font-size="11" font-weight="600" text-anchor="end" >2018</text><circle class="acc" cx="120" cy="92" r="5.5"/><text x="138.0" y="96.0" class="ink" font-size="12.5" font-weight="400" text-anchor="start" >Layer 6 acquired by TD</text><text x="104.0" y="126.0" class="watch mono" font-size="11" font-weight="600" text-anchor="end" >Oct 2024</text><rect class="watch" x="115" y="117" width="10" height="10" rx="1"/><text x="138.0" y="126.0" class="ink" font-size="12.5" font-weight="400" text-anchor="start" >US AML guilty plea; OCC asset cap on US bank</text><text x="104.0" y="156.0" class="acc mono" font-size="11" font-weight="600" text-anchor="end" >Jul 2025</text><circle class="acc" cx="120" cy="152" r="5.5"/><text x="138.0" y="156.0" class="ink" font-size="12.5" font-weight="400" text-anchor="start" >TD AI Prism foundation model announced</text><text x="104.0" y="186.0" class="ink mono" font-size="11" font-weight="600" text-anchor="end" >Sep 2025</text><circle class="ink" cx="120" cy="182" r="5.5"/><text x="138.0" y="186.0" class="ink" font-size="12.5" font-weight="400" text-anchor="start" >Investor Day; OSFI publishes final E-23</text><text x="104.0" y="216.0" class="acc mono" font-size="11" font-weight="600" text-anchor="end" >Dec 2025</text><circle class="acc" cx="120" cy="212" r="5.5"/><text x="138.0" y="216.0" class="ink" font-size="12.5" font-weight="400" text-anchor="start" >75 AI use cases, C$170M value in FY2025</text><text x="104.0" y="246.0" class="acc mono" font-size="11" font-weight="600" text-anchor="end" >Jan 2026</text><circle class="acc" cx="120" cy="242" r="5.5"/><text x="138.0" y="246.0" class="ink" font-size="12.5" font-weight="400" text-anchor="start" >Mortgage pre-adjudication agent deployed</text><text x="104.0" y="276.0" class="watch mono" font-size="11" font-weight="600" text-anchor="end" >Apr 2026</text><rect class="watch" x="115" y="267" width="10" height="10" rx="1"/><text x="138.0" y="276.0" class="ink" font-size="12.5" font-weight="400" text-anchor="start" >SR 26-2: gen and agentic AI out of scope</text><text x="104.0" y="306.0" class="acc mono" font-size="11" font-weight="600" text-anchor="end" >May 2026</text><circle class="acc" cx="120" cy="302" r="5.5"/><text x="138.0" y="306.0" class="ink" font-size="12.5" font-weight="400" text-anchor="start" >Mortgage agent announced (15 h to &lt;3 min)</text><text x="104.0" y="336.0" class="watch mono" font-size="11" font-weight="600" text-anchor="end" >Jul 2026</text><rect class="watch" x="115" y="327" width="10" height="10" rx="1"/><text x="138.0" y="336.0" class="ink" font-size="12.5" font-weight="400" text-anchor="start" >OSFI bulletin on generative and agentic AI</text><text x="104.0" y="366.0" class="acc mono" font-size="11" font-weight="600" text-anchor="end" >Aug 2026</text><circle class="acc" cx="120" cy="362" r="5.5"/><text x="138.0" y="366.0" class="ink" font-size="12.5" font-weight="400" text-anchor="start" >C$195M AI value in first 9 months of FY2026</text><text x="104.0" y="396.0" class="acc mono" font-size="11" font-weight="600" text-anchor="end" >Oct 2026</text><circle class="acc" cx="120" cy="392" r="5.5"/><text x="138.0" y="396.0" class="ink" font-size="12.5" font-weight="600" text-anchor="start" >Evident AI Index No. 10; Credit Assist launched</text><text x="104.0" y="426.0" class="watch mono" font-size="11" font-weight="600" text-anchor="end" >May 2027</text><rect class="watch" x="115" y="417" width="10" height="10" rx="1"/><text x="138.0" y="426.0" class="ink" font-size="12.5" font-weight="400" text-anchor="start" >OSFI E-23 takes effect</text><circle class="acc" cx="30" cy="456" r="5"/><text x="42.0" y="460.0" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >TD milestone</text><rect class="watch" x="160" y="451" width="10" height="10" rx="1"/><text x="178.0" y="460.0" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >Regulation or enforcement</text><circle class="ink" cx="384" cy="456" r="5"/><text x="396.0" y="460.0" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >Both</text></svg>