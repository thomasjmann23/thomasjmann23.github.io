<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 436" width="680" height="436" role="img" aria-labelledby="t d"><title id="t">How TD describes Credit Assist</title><desc id="d">Process diagram. A commercial deal file of 20 to 30 documents spanning more than 50 document types goes to an orchestration layer, which coordinates specialised AI agents that extract, analyse, draft with citations and review. They build six credit memo sections in parallel. The cited draft goes to a TD credit professional, who questions, verifies and refines it and owns the recommendation and final decision. Stated result: first draft in under 30 minutes instead of up to three working days.</desc><style>
.bg{fill:#f1f1ed}.ink{fill:#16181c}.mut{fill:#50555d}.acc{fill:#2346d8}.acc2{fill:#8fa0ea}.watch{fill:#7d5300}.high{fill:#a8321f}
.rule{stroke:rgba(22,24,28,.16);stroke-width:1}.rule2{stroke:#16181c;stroke-width:1}.accs{stroke:#2346d8}.watchs{stroke:#7d5300}.inks{stroke:#16181c}.muts{stroke:#50555d}.highs{stroke:#a8321f}
.box{fill:#e7e7e2;stroke:rgba(22,24,28,.3)}.boxa{fill:rgba(35,70,216,.08);stroke:#2346d8}.boxw{fill:rgba(125,83,0,.08);stroke:#7d5300}
text{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}.mono{font-family:"IBM Plex Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){.bg{fill:#1b1c20}.ink{fill:#e6e5e0}.mut{fill:#a2a5ab}.acc{fill:#93a6ff}.acc2{fill:#c9d2ff}.watch{fill:#f0c46a}.high{fill:#ff9a85}
.rule{stroke:rgba(230,229,224,.14)}.rule2,.inks{stroke:#e6e5e0}.accs{stroke:#93a6ff}.watchs{stroke:#f0c46a}.muts{stroke:#a2a5ab}.highs{stroke:#ff9a85}
.box{fill:#18191c;stroke:rgba(230,229,224,.28)}.boxa{fill:rgba(147,166,255,.1);stroke:#93a6ff}.boxw{fill:rgba(240,196,106,.1);stroke:#f0c46a}}
</style><rect class="bg" width="680" height="436" rx="6"/><text x="24.0" y="34.0" class="ink" font-size="19" font-weight="700" text-anchor="start" font-stretch="112%">Credit Assist, as TD describes it</text><text x="24.0" y="56.0" class="mut mono" font-size="12" font-weight="400" text-anchor="start" >Commercial credit memo drafting, TD Bank U.S., Oct 2026</text><rect class="box" x="24" y="84" width="150" height="150" rx="4" /><text x="36.0" y="106.0" class="ink" font-size="13" font-weight="600" text-anchor="start" >Deal file</text><text x="36.0" y="128.0" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >20 to 30 documents</text><text x="36.0" y="146.0" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >50+ document types</text><text x="36.0" y="164.0" class="mut" font-size="11" font-weight="400" text-anchor="start" >(financials, tax</text><text x="36.0" y="182.0" class="mut" font-size="11" font-weight="400" text-anchor="start" >returns, appraisals,</text><text x="36.0" y="200.0" class="mut" font-size="11" font-weight="400" text-anchor="start" >agreements, etc.)</text><line class="muts" x1="176" y1="159" x2="206" y2="159" stroke-width="1.4"/><path class="muts" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M199.7 162.0 L206 159 L199.7 156.0"/><rect class="boxa" x="208" y="84" width="128" height="150" rx="4" /><text x="272.0" y="140.0" class="acc" font-size="13" font-weight="600" text-anchor="middle" >Orchestration</text><text x="272.0" y="158.0" class="acc" font-size="13" font-weight="600" text-anchor="middle" >layer</text><text x="272.0" y="190.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >assigns work</text><text x="272.0" y="204.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >to agents</text><line class="muts" x1="338" y1="159" x2="368" y2="104" stroke-width="1.4"/><path class="muts" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M367.7 111.0 L368 104 L362.3 108.1"/><rect class="box" x="370" y="92" width="120" height="26" rx="4" /><text x="430.0" y="109.0" class="ink" font-size="11" font-weight="500" text-anchor="middle" >Extract</text><line class="muts" x1="338" y1="159" x2="368" y2="140" stroke-width="1.4"/><path class="muts" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M364.3 145.9 L368 140 L361.0 140.8"/><rect class="box" x="370" y="128" width="120" height="26" rx="4" /><text x="430.0" y="145.0" class="ink" font-size="11" font-weight="500" text-anchor="middle" >Analyse</text><line class="muts" x1="338" y1="159" x2="368" y2="176" stroke-width="1.4"/><path class="muts" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M361.0 175.5 L368 176 L364.0 170.2"/><rect class="box" x="370" y="164" width="120" height="26" rx="4" /><text x="430.0" y="181.0" class="ink" font-size="11" font-weight="500" text-anchor="middle" >Draft + cite</text><line class="muts" x1="338" y1="159" x2="368" y2="212" stroke-width="1.4"/><path class="muts" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M362.2 208.0 L368 212 L367.5 205.0"/><rect class="box" x="370" y="200" width="120" height="26" rx="4" /><text x="430.0" y="217.0" class="ink" font-size="11" font-weight="500" text-anchor="middle" >Review, refine</text><text x="430.0" y="244.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >specialised agents,</text><text x="430.0" y="257.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >sections in parallel</text><line class="muts" x1="492" y1="159" x2="520" y2="159" stroke-width="1.4"/><path class="muts" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M513.7 162.0 L520 159 L513.7 156.0"/><rect class="boxa" x="522" y="84" width="134" height="150" rx="4" /><text x="589.0" y="108.0" class="acc" font-size="13" font-weight="600" text-anchor="middle" >Cited draft</text><rect class="acc2" x="540" y="122" width="98" height="8" rx="2"/><rect class="acc2" x="540" y="138" width="80" height="8" rx="2"/><rect class="acc2" x="540" y="154" width="98" height="8" rx="2"/><rect class="acc2" x="540" y="170" width="80" height="8" rx="2"/><rect class="acc2" x="540" y="186" width="98" height="8" rx="2"/><rect class="acc2" x="540" y="202" width="80" height="8" rx="2"/><text x="589.0" y="226.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >6 memo sections</text><line class="muts" x1="589" y1="236" x2="589" y2="290" stroke-width="1.4"/><path class="muts" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" d="M586.0 283.7 L589 290 L592.0 283.7"/><rect class="boxw" x="24" y="292" width="632" height="78" rx="4" /><text x="40.0" y="316.0" class="watch" font-size="13" font-weight="600" text-anchor="start" >Credit professional (300+ at TD Bank U.S.)</text><text x="40.0" y="338.0" class="ink" font-size="11.5" font-weight="400" text-anchor="start" >Questions, verifies and refines the draft against TD standards; required controls and reviews stay in place.</text><text x="40.0" y="356.0" class="ink" font-size="11.5" font-weight="600" text-anchor="start" >Owns the lending recommendation and the final decision.</text><text x="24.0" y="398.0" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >Stated output: first draft in under 30 minutes, down from up to three working days.</text><text x="24.0" y="416.0" class="mut mono" font-size="11" font-weight="400" text-anchor="start" >Not stated: model or vendor, review time after the draft, production accuracy.</text></svg>