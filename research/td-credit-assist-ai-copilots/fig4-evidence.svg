.rule{stroke:rgba(22,24,28,.16);stroke-width:1}.rule2{stroke:#16181c;stroke-width:1}.accs{stroke:#2346d8}.watchs{stroke:#7d5300}.inks{stroke:#16181c}.muts{stroke:#50555d}.highs{stroke:#a8321f}
.box{fill:#e7e7e2;stroke:rgba(22,24,28,.3)}.boxa{fill:rgba(35,70,216,.08);stroke:#2346d8}.boxw{fill:rgba(125,83,0,.08);stroke:#7d5300}
text{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}.mono{font-family:"IBM Plex Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){.bg{fill:#1b1c20}.ink{fill:#e6e5e0}.mut{fill:#a2a5ab}.acc{fill:#93a6ff}.acc2{fill:#c9d2ff}.watch{fill:#f0c46a}.high{fill:#ff9a85}
.rule{stroke:rgba(230,229,224,.14)}.rule2,.inks{stroke:#e6e5e0}.accs{stroke:#93a6ff}.watchs{stroke:#f0c46a}.muts{stroke:#a2a5ab}.highs{stroke:#ff9a85}
.box{fill:#18191c;stroke:rgba(230,229,224,.28)}.boxa{fill:rgba(147,166,255,.1);stroke:#93a6ff}.boxw{fill:rgba(240,196,106,.1);stroke:#f0c46a}}
</style><rect class="bg" width="680" height="464" rx="6"/><text x="24.0" y="34.0" class="ink" font-size="19" font-weight="700" text-anchor="start" font-stretch="112%">What the claims disclose</text><text x="24.0" y="56.0" class="mut mono" font-size="12" font-weight="400" text-anchor="start" >Public time-saving and quality claims for AI credit memo tools</text><text x="330.0" y="100.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >Baseline</text><text x="404.0" y="100.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >Method</text><text x="478.0" y="100.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >Sample</text><text x="552.0" y="92.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >From</text><text x="552.0" y="106.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >production</text><text x="626.0" y="92.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >Checked</text><text x="626.0" y="106.0" class="mut mono" font-size="10" font-weight="400" text-anchor="middle" >independently</text><text x="24.0" y="100.0" class="mut mono" font-size="10" font-weight="400" text-anchor="start" >Deployment and headline claim</text><line class="rule2" x1="24" y1="114" x2="656" y2="114" /><text x="24.0" y="138.0" class="acc" font-size="12.5" font-weight="600" text-anchor="start" >TD Credit Assist</text><text x="24.0" y="154.0" class="mut" font-size="11" font-weight="400" text-anchor="start" >3 days to &lt;30 min; 95% pass</text><circle class="acc" cx="330" cy="142" r="6"/><circle class="bg accs" cx="404" cy="142" r="5.5" stroke-width="1.4"/><path class="acc" d="M404 136.5 A5.5 5.5 0 0 1 404 147.5 Z"/><circle class="acc" cx="478" cy="142" r="6"/><circle class="bg muts" cx="552" cy="142" r="5.5" stroke-width="1.2"/><circle class="bg muts" cx="626" cy="142" r="5.5" stroke-width="1.2"/><line class="rule" x1="24" y1="166" x2="656" y2="166" /><text x="24.0" y="180.0" class="acc" font-size="12.5" font-weight="600" text-anchor="start" >TD mortgage agent</text><text x="24.0" y="196.0" class="mut" font-size="11" font-weight="400" text-anchor="start" >15 h to &lt;3 min</text><circle class="acc" cx="330" cy="184" r="6"/><circle class="bg muts" cx="404" cy="184" r="5.5" stroke-width="1.2"/><circle class="bg muts" cx="478" cy="184" r="5.5" stroke-width="1.2"/><circle class="bg accs" cx="552" cy="184" r="5.5" stroke-width="1.4"/><path class="acc" d="M552 178.5 A5.5 5.5 0 0 1 552 189.5 Z"/><circle class="bg muts" cx="626" cy="184" r="5.5" stroke-width="1.2"/><line class="rule" x1="24" y1="208" x2="656" y2="208" /><text x="24.0" y="222.0" class="ink" font-size="12.5" font-weight="600" text-anchor="start" >DBS credit memo agents</text><text x="24.0" y="238.0" class="mut" font-size="11" font-weight="400" text-anchor="start" >at least 30% (target)</text><circle class="acc" cx="330" cy="226" r="6"/><circle class="bg muts" cx="404" cy="226" r="5.5" stroke-width="1.2"/><circle class="bg accs" cx="478" cy="226" r="5.5" stroke-width="1.4"/><path class="acc" d="M478 220.5 A5.5 5.5 0 0 1 478 231.5 Z"/><circle class="bg accs" cx="552" cy="226" r="5.5" stroke-width="1.4"/><path class="acc" d="M552 220.5 A5.5 5.5 0 0 1 552 231.5 Z"/><circle class="bg muts" cx="626" cy="226" r="5.5" stroke-width="1.2"/><line class="rule" x1="24" y1="250" x2="656" y2="250" /><text x="24.0" y="264.0" class="ink" font-size="12.5" font-weight="600" text-anchor="start" >Moody&#x27;s at Taishin</text><text x="24.0" y="280.0" class="mut" font-size="11" font-weight="400" text-anchor="start" >up to 50% in some steps</text><circle class="bg accs" cx="330" cy="268" r="5.5" stroke-width="1.4"/><path class="acc" d="M330 262.5 A5.5 5.5 0 0 1 330 273.5 Z"/><circle class="bg muts" cx="404" cy="268" r="5.5" stroke-width="1.2"/><circle class="bg muts" cx="478" cy="268" r="5.5" stroke-width="1.2"/><circle class="acc" cx="552" cy="268" r="6"/><circle class="bg muts"