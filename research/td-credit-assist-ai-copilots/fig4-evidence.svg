<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 464" width="680" height="464" role="img" aria-labelledby="t d"><title id="t">How much each credit copilot claim discloses</title><desc id="d">Matrix. For seven public claims about AI credit memo tools, whether the source states a baseline, a measurement method, a sample, whether the figure comes from production use, and whether anyone independent checked it. TD Credit Assist states a baseline and a 220-deal test sample, partly states its method, does not say the figures come from production and has no independent check. The TD mortgage agent states a baseline and partly production use. DBS states a baseline, partly a sample and partly production, but its figure is a target. Moody&#x27;s at Taishin partly states a baseline and states production use. Moody&#x27;s agentic memo claim partly states a baseline only. nCino&#x27;s unnamed bank partly states production use. Great Southern states production use only. None has independent verification.</desc><style>
